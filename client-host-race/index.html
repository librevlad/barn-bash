<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <title>Frantics — Grand Prix</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--bg-wood-deep);
      background-image: var(--bg-wood-plank);
      overflow: hidden;
      font-family: var(--font-ui);
      color: var(--text-cream);
    }
    canvas { display: block; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: none;
      padding: 10px 20px;
      justify-content: space-between;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(61, 40, 23, 0.72) 0%, transparent 100%);
    }
    .hud-left { display: flex; flex-direction: column; gap: 2px; }
    .hud-right { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
    .hud-title {
      font-family: var(--font-accent);
      font-size: 10px;
      letter-spacing: var(--tracking-wider);
      color: var(--text-dim);
      text-transform: uppercase;
    }
    /* In-lobby eyebrow sits on the painted arch; needs strong contrast. */
    #lobby .hud-title {
      font-size: 12px;
      letter-spacing: 6px;
      color: var(--accent-gold);
      text-shadow: 0 1px 0 var(--accent-red-deep),
                   0 0 14px rgba(0, 0, 0, 0.8);
    }
    .hud-lap {
      font-family: var(--font-display);
      font-size: 26px; font-weight: 400;
      color: var(--accent-gold);
      text-shadow: 0 2px 0 var(--accent-red-deep),
                   0 0 14px rgba(244, 197, 66, 0.4);
      letter-spacing: 0.5px;
    }
    .hud-pos {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 400;
      color: var(--accent-gold-hot);
      letter-spacing: 1px;
      text-shadow: 0 1px 0 var(--accent-red-deep);
    }
    #countdown {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-family: var(--font-display);
      font-size: 120px; font-weight: 400;
      color: var(--accent-gold);
      z-index: 20;
      text-shadow: 0 4px 0 var(--accent-red-deep),
                   0 8px 30px rgba(244, 197, 66, 0.6);
      letter-spacing: 3px;
      display: none;
      transition: transform 0.3s, opacity 0.3s;
    }
    #message {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      font-family: var(--font-display);
      font-size: 28px; font-weight: 400;
      color: var(--accent-gold);
      z-index: 15;
      text-shadow: 0 2px 0 var(--accent-red-deep),
                   0 4px 16px rgba(0, 0, 0, 0.7);
      letter-spacing: 1.5px;
      opacity: 0;
      transition: opacity 0.25s ease-out, transform 0.25s ease-out;
      pointer-events: none;
    }
    #message.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    #winner-overlay {
      position: fixed; inset: 0; z-index: 30;
      background: rgba(47, 28, 12, 0.9);
      backdrop-filter: blur(6px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.6s;
    }
    #winner-overlay.show { opacity: 1 !important; pointer-events: auto !important; }
    .w-text {
      font-family: var(--font-display);
      font-size: 40px; font-weight: 400;
      letter-spacing: 1px;
      text-shadow: 0 2px 0 var(--accent-red-deep),
                   0 0 28px currentColor;
    }
    .w-sub {
      font-family: var(--font-accent);
      font-size: 15px; font-style: italic;
      color: var(--text-dim);
      margin-top: 8px;
      letter-spacing: 0.5px;
    }
    #controls {
      display: none;
      justify-content: center; gap: 14px;
      margin-top: 26px; z-index: 31;
    }
    #controls button {
      font-family: var(--font-display);
      font-size: 16px;
      padding: 14px 28px;
      background: var(--bg-ticket-face);
      color: var(--text-on-gold);
      border: var(--border-norm) solid var(--accent-gold-edge);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-ticket);
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform var(--dur-tap), box-shadow var(--dur-tap);
    }
    #controls button:hover {
      background: var(--bg-ticket-face-hot);
      transform: translateY(-1px);
      box-shadow: var(--shadow-ticket-hover);
    }
    #controls button:active {
      transform: translateY(3px);
      box-shadow: var(--shadow-ticket-press);
    }
    #lobby {
      position: fixed; inset: 0; z-index: 5;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #lobby.hidden { display: none; }
    /* Phase 10a — painterly carnival arch backdrop behind title stack */
    #lobby .lobby-backdrop {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      max-height: 500px; max-width: 700px;
      width: auto; height: auto;
      opacity: 0.95;
      z-index: 0;
      pointer-events: none;
    }
    #lobby > *:not(.lobby-backdrop) { position: relative; z-index: 1; }
    #lobby h1 {
      font-family: var(--font-display);
      font-size: 48px; font-weight: 400;
      color: var(--accent-gold);
      text-shadow: var(--text-shadow-stack);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    #lobby-info {
      font-family: var(--font-accent);
      font-size: 15px; font-style: italic;
      color: var(--text-cream);
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.8),
                   0 0 12px rgba(0, 0, 0, 0.7);
      margin-bottom: 20px;
      letter-spacing: 0.3px;
    }
    #lobby-players {
      display: flex; gap: 10px;
      margin-bottom: 28px; min-height: 30px;
      flex-wrap: wrap; justify-content: center;
    }
    #btn-start {
      font-family: var(--font-display);
      font-size: 20px; font-weight: 400;
      padding: 16px 38px;
      background: var(--bg-ticket-face);
      color: var(--text-on-gold);
      border: var(--border-norm) solid var(--accent-gold-edge);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-ticket);
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: transform var(--dur-tap), box-shadow var(--dur-tap);
    }
    #btn-start:hover {
      background: var(--bg-ticket-face-hot);
      transform: translateY(-1px);
      box-shadow: var(--shadow-ticket-hover);
    }
    #btn-start:active {
      transform: translateY(3px);
      box-shadow: var(--shadow-ticket-press);
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="hud" style="display:none">
    <div class="hud-left">
      <div class="hud-title">GRAND PRIX</div>
      <div class="hud-lap" id="hud-lap">Lap 1/3</div>
    </div>
    <div class="hud-right">
      <div class="hud-pos" id="hud-pos"></div>
      <div class="hud-title" id="hud-alive">0/0</div>
    </div>
  </div>
  <div id="countdown"></div>
  <div id="message"></div>
  <div id="winner-overlay">
    <div id="controls">
      <button id="btn-again">PLAY AGAIN</button>
      <button id="btn-lobby">LOBBY</button>
    </div>
  </div>
  <div id="lobby">
    <img class="lobby-backdrop" src="/assets/lobby-race.png" onerror="this.remove()">
    <div class="hud-title">FRANTICS</div>
    <h1>GRAND PRIX</h1>
    <div id="lobby-info">Waiting for players...</div>
    <div id="lobby-players"></div>
    <button id="btn-start" style="display:none">START</button>
  </div>
  <script src="/shared/icons.js"></script>
  <script src="/shared/characters.js"></script>
  <script src="/shared/host-common.js"></script>
  <script src="/shared/narrator.js"></script>
  <script src="/shared/sound.js"></script>
  <script src="/shared/hud.js"></script>
  <script src="/shared/effects.js"></script>
  <script src="/shared/visual.js"></script>
  <script src="/shared/transitions.js"></script>
  <script src="/shared/tournament.js"></script>
  <script src="/shared/ambient-fx.js"></script>
  <script src="/shared/postgame.js"></script>
  <!-- Engine modules -->
  <script src="/engine/palette.js"></script>
  <script src="/engine/GameLoop.js"></script>
  <script src="/engine/Camera2D.js"></script>
  <script src="/engine/Tween.js"></script>
  <script src="/engine/Scene.js"></script>
  <script src="/engine/Particles.js"></script>
  <script src="/engine/Entity.js"></script>
  <script src="/engine/SpriteLoader.js"></script>
  <script src="render2d.js"></script>
  <script src="main.js"></script>
</body>
</html>
