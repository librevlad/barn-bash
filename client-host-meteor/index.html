<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Frantics — Meteor Shower</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0C0608; font-family: -apple-system, 'Segoe UI', sans-serif; color: #eee; }
    canvas { display: block; position: fixed; inset: 0; }

    /* Vignette */
    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.5) 100%);
    }

    /* HUD */
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 5;
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 20px 32px; pointer-events: none;
    }
    .hud-left { }
    .hud-title { font-size: 10px; letter-spacing: 5px; opacity: 0.4; text-transform: uppercase; }
    .hud-wave { font-size: 32px; font-weight: 900; letter-spacing: 2px; }
    .hud-warn { font-size: 14px; color: #FF6644; margin-top: 4px; font-weight: 600; }
    .hud-right { text-align: right; }
    .hud-alive { font-size: 16px; font-weight: 600; opacity: 0.8; }

    /* Center message */
    #message {
      position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%);
      font-size: 28px; font-weight: 900; letter-spacing: 3px;
      text-shadow: 0 3px 20px rgba(255,60,0,0.5);
      pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 5;
    }
    #message.show { opacity: 1; }

    /* Countdown */
    #countdown {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 120px; font-weight: 900; color: #fff;
      text-shadow: 0 4px 40px rgba(255,80,20,0.6), 0 0 80px rgba(255,255,255,0.1);
      pointer-events: none; display: none; z-index: 25;
      transition: transform 0.4s cubic-bezier(0.22,1,0.36,1), opacity 0.3s;
    }

    /* Winner overlay */
    #winner-overlay {
      position: fixed; inset: 0; background: rgba(12,6,8,0.85);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.6s; z-index: 10;
    }
    #winner-overlay.show { opacity: 1; pointer-events: auto; }
    .w-text { font-size: 40px; font-weight: 900; text-shadow: 0 0 40px rgba(255,120,40,0.4); }
    .w-sub { font-size: 16px; color: #888; margin-top: 12px; }

    /* Controls */
    #controls {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      z-index: 20; display: none; gap: 14px;
    }
    button {
      font-size: 15px; padding: 14px 40px; font-weight: 600;
      background: rgba(40,15,10,0.8); color: #ccc;
      border: 1px solid rgba(255,120,40,0.2); border-radius: 10px;
      cursor: pointer; backdrop-filter: blur(8px); transition: all 0.2s;
    }
    button:hover { background: rgba(60,25,15,0.9); color: #fff; border-color: rgba(255,120,40,0.4); }

    /* Lobby */
    #lobby {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0C0608 0%, #1A0A0E 50%, #120810 100%);
    }
    #lobby.hidden { display: none; }
    #lobby h1 { font-size: 10px; letter-spacing: 8px; color: #555; margin-bottom: 8px; }
    #lobby h2 { font-size: 32px; color: #FF6633; font-weight: 900; margin-bottom: 24px;
                text-shadow: 0 0 50px rgba(255,100,50,0.3); letter-spacing: 2px; }
    #lobby-info { font-size: 14px; color: #666; margin-bottom: 20px; }
    #lobby-players { font-size: 18px; margin-bottom: 28px; }
    #lobby button { font-size: 17px; padding: 16px 56px; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="vignette"></div>
  <div id="hud" style="display:none">
    <div class="hud-left">
      <div class="hud-title">METEOR SHOWER</div>
      <div class="hud-wave" id="hud-wave">Wave 1</div>
      <div class="hud-warn" id="hud-warn"></div>
    </div>
    <div class="hud-right">
      <div class="hud-alive" id="hud-alive">2/2 alive</div>
    </div>
  </div>
  <div id="countdown"></div>
  <div id="message"></div>
  <div id="winner-overlay"></div>
  <div id="lobby">
    <h1>FRANTICS</h1>
    <h2>METEOR SHOWER</h2>
    <div id="lobby-info">Waiting for players...</div>
    <div id="lobby-players"></div>
    <button id="btn-start" style="display:none">START</button>
  </div>
  <div id="controls">
    <button id="btn-again">PLAY AGAIN</button>
    <button id="btn-lobby">LOBBY</button>
  </div>
  <script src="/shared/characters.js"></script>
  <script src="/shared/narrator.js"></script>
  <script src="/shared/sound.js"></script>
  <script src="/shared/hud.js"></script>
  <script src="/shared/effects.js"></script>
  <script src="/shared/transitions.js"></script>
  <script src="/shared/tournament.js"></script>
  <script src="render2d.js"></script>
  <script src="main.js"></script>
</body>
</html>
