<!DOCTYPE html>
<html><head><title>Modal Tickets Slicer</title></head>
<body style="background:#222;color:#eee;font-family:monospace;padding:16px">
<pre id="log"></pre>
<div id="previews" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"></div>
<script>
const log = s => { document.getElementById('log').textContent += s + '\n'; };

// modal-game-select.png is 1440x736. Tickets in 2x2 grid + back + tournament.
const REGIONS = {
  'ticket-escape':   {x:  105, y: 195, w: 560, h: 175},
  'ticket-hill':     {x:  735, y: 195, w: 560, h: 175},
  'ticket-meteor':   {x:  105, y: 400, w: 560, h: 175},
  'ticket-gp':       {x:  735, y: 400, w: 560, h: 175},
  'ticket-back':     {x:   75, y: 600, w: 280, h: 110},
  'ticket-tourn':    {x:  390, y: 600, w: 740, h: 120},
};

const img = new Image();
img.src = '/assets/modal-game-select.png';
img.onload = () => {
  log('Loaded: ' + img.width + 'x' + img.height);
  window._results = {};

  for (const [name, r] of Object.entries(REGIONS)) {
    const c = document.createElement('canvas');
    c.width = r.w; c.height = r.h;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
    // No chroma key — tickets have solid backgrounds that should remain opaque.
    // BG around tickets (red carnival) would leak in at edges but we tune coords instead.

    window._results[name] = c.toDataURL('image/png');
    log(name + ': ' + r.w + 'x' + r.h);

    const div = document.createElement('div');
    div.style.cssText = 'background:#444;padding:6px;border-radius:8px;text-align:center';
    div.innerHTML = '<div style="font-size:10px;color:#aaa">' + name + '</div>';
    const p = new Image(); p.src = window._results[name]; p.style.maxHeight = '90px'; p.style.maxWidth = '240px';
    div.appendChild(p);
    document.getElementById('previews').appendChild(div);
  }

  // Debug overlay
  const dbg = document.createElement('canvas');
  dbg.width = img.width; dbg.height = img.height;
  dbg.style.cssText = 'width:100%;max-width:1000px;margin-top:16px;border:1px solid #555';
  const dctx = dbg.getContext('2d');
  dctx.drawImage(img, 0, 0);
  dctx.strokeStyle = '#0f0'; dctx.lineWidth = 4;
  for (const [name, r] of Object.entries(REGIONS)) {
    dctx.strokeRect(r.x, r.y, r.w, r.h);
    dctx.fillStyle = '#0f0'; dctx.font = 'bold 20px monospace';
    dctx.fillText(name, r.x + 8, r.y + 24);
  }
  document.body.appendChild(dbg);
  log('Done!');
};
</script>
</body></html>
