<!DOCTYPE html>
<html><head><title>Race Items Slicer</title></head>
<body style="background:#222;color:#eee;font-family:monospace;padding:16px">
<pre id="log"></pre>
<div id="previews" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"></div>
<script>
const log = s => { document.getElementById('log').textContent += s + '\n'; };

// race-sprites.png is 1536x1024. Extract items + decorations.
const REGIONS = {
  // Items (right column, roughly)
  'item-boost':   {x: 1420, y: 290, w: 100, h: 100},  // yellow/fire ring
  'item-oil':     {x: 1280, y: 50, w: 110, h: 100},   // oil drum
  'item-missile': {x: 1400, y: 50, w: 110, h: 100},   // rocket
  // Decorations
  'tree-1':       {x: 20, y: 95, w: 130, h: 140},
  'tree-2':       {x: 160, y: 95, w: 130, h: 140},
  'rock-1':       {x: 20, y: 250, w: 110, h: 90},
  'bush-1':       {x: 20, y: 495, w: 140, h: 120},
  // Item variants
  'item-star':    {x: 1200, y: 285, w: 80, h: 70},
  'flame-pad':    {x: 900, y: 310, w: 140, h: 100},  // flame ground pad
};

const img = new Image();
img.src = '/assets/race-sprites.png';
img.onload = () => {
  log('Loaded: ' + img.width + 'x' + img.height);
  window._results = {};

  for (const [name, r] of Object.entries(REGIONS)) {
    const c = document.createElement('canvas');
    c.width = r.w; c.height = r.h;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);

    // Remove white bg
    const id = ctx.getImageData(0, 0, r.w, r.h);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const R = d[i], G = d[i+1], B = d[i+2];
      if (R > 240 && G > 240 && B > 240) d[i+3] = 0;
      else if (R > 225 && G > 225 && B > 225) d[i+3] = Math.round(255 * (1 - (Math.min(R,G,B) - 225) / 15));
    }
    ctx.putImageData(id, 0, 0);

    window._results[name] = c.toDataURL('image/png');
    log(name + ': ' + r.w + 'x' + r.h);

    const div = document.createElement('div');
    div.style.cssText = 'background:#444;padding:6px;border-radius:8px;text-align:center';
    div.innerHTML = '<div style="font-size:10px;color:#aaa">' + name + '</div>';
    const p = new Image(); p.src = window._results[name]; p.style.height = '70px';
    div.appendChild(p);
    document.getElementById('previews').appendChild(div);
  }

  const dbg = document.createElement('canvas');
  dbg.width = img.width; dbg.height = img.height;
  dbg.style.cssText = 'width:100%;max-width:1000px;margin-top:16px;border:1px solid #555';
  const dctx = dbg.getContext('2d');
  dctx.drawImage(img, 0, 0);
  dctx.strokeStyle = '#f00'; dctx.lineWidth = 3;
  for (const [name, r] of Object.entries(REGIONS)) {
    dctx.strokeRect(r.x, r.y, r.w, r.h);
    dctx.fillStyle = '#f00'; dctx.font = '14px monospace';
    dctx.fillText(name, r.x + 4, r.y + 16);
  }
  document.body.appendChild(dbg);
  log('Done!');
};
</script>
</body></html>
