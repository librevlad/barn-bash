<!DOCTYPE html>
<html><head><title>Game Button Slicer</title></head>
<body style="background:#222;color:#eee;font-family:monospace;padding:16px">
<pre id="log"></pre>
<div id="previews" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px"></div>
<script>
const log = s => { document.getElementById('log').textContent += s + '\n'; };

// Hardcoded regions from visual analysis of btns.png (1440x736)
// Layout: 2 groups of 3 columns (normal/hover/pressed), 4 rows
// Left group cols: ~30, ~240, ~450.  Right group cols: ~730, ~940, ~1150
// Ticket size: ~200x120. Row heights: ~90,230,370,520
const BTNS = {
  // Row 1: Escape Fox (left) + Race small (right)
  'escape-normal':  {x:25,  y:140, w:210, h:110},
  'escape-hover':   {x:235, y:140, w:210, h:110},
  'escape-pressed': {x:445, y:140, w:210, h:110},
  'race-normal':    {x:725, y:140, w:210, h:110},
  'race-hover':     {x:935, y:140, w:210, h:110},
  'race-pressed':   {x:1145,y:140, w:210, h:110},
  // Row 2: King of Hill (left) + Race large (right)
  'hill-normal':    {x:25,  y:260, w:210, h:120},
  'hill-hover':     {x:235, y:260, w:210, h:120},
  'hill-pressed':   {x:445, y:260, w:210, h:120},
  // Row 3: Meteor (left) + Tournament (right)
  'meteor-normal':  {x:25,  y:405, w:210, h:120},
  'meteor-hover':   {x:235, y:405, w:210, h:120},
  'meteor-pressed': {x:445, y:405, w:210, h:120},
  'tourn-normal':   {x:725, y:405, w:210, h:120},
  'tourn-hover':    {x:935, y:405, w:210, h:120},
  'tourn-pressed':  {x:1145,y:405, w:210, h:120},
  // Row 4: Grand Prix large (left) + Back buttons (right)
  'gp-normal':      {x:25,  y:555, w:210, h:155},
  'gp-hover':       {x:235, y:555, w:210, h:155},
  'gp-pressed':     {x:445, y:555, w:210, h:155},
  'back-normal':    {x:1050,y:585, w:110, h:110},
  'back-hover':     {x:1170,y:585, w:110, h:110},
  'back-pressed':   {x:1290,y:585, w:110, h:110},
};

const img = new Image();
img.src = '/assets/btns.png';
img.onload = () => {
  const W = img.width, H = img.height;
  log('Loaded: ' + W + 'x' + H);
  window._results = {};
  const bgR = 230, bgG = 201, bgB = 141; // parchment

  for (const [name, r] of Object.entries(BTNS)) {
    const PAD = 8;
    const sx = Math.max(0, r.x - PAD), sy = Math.max(0, r.y - PAD);
    const sw = Math.min(W - sx, r.w + PAD*2), sh = Math.min(H - sy, r.h + PAD*2);

    const c = document.createElement('canvas');
    c.width = sw; c.height = sh;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);

    // Remove parchment bg
    const id = ctx.getImageData(0, 0, sw, sh);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const dr = Math.abs(d[i]-bgR), dg = Math.abs(d[i+1]-bgG), db = Math.abs(d[i+2]-bgB);
      const maxD = Math.max(dr, dg, db);
      if (maxD < 18) d[i+3] = 0;
      else if (maxD < 35) d[i+3] = Math.round(255 * (maxD-18) / 17);
    }
    ctx.putImageData(id, 0, 0);

    window._results[name] = c.toDataURL('image/png');
    log(name + ': ' + sw + 'x' + sh);

    const div = document.createElement('div');
    div.style.cssText = 'background:#444;padding:4px;border-radius:6px;text-align:center';
    div.innerHTML = '<div style="font-size:8px;color:#aaa">' + name + '</div>';
    const p = new Image(); p.src = window._results[name]; p.style.height = '35px';
    div.appendChild(p);
    document.getElementById('previews').appendChild(div);
  }

  // Debug overlay
  const dbg = document.createElement('canvas');
  dbg.width = W; dbg.height = H;
  dbg.style.cssText = 'width:100%;max-width:1000px;margin-top:16px;border:1px solid #555';
  const dctx = dbg.getContext('2d');
  dctx.drawImage(img, 0, 0);
  dctx.strokeStyle = '#0f0'; dctx.lineWidth = 2;
  for (const [name, r] of Object.entries(BTNS)) {
    dctx.strokeRect(r.x, r.y, r.w, r.h);
    dctx.fillStyle = '#0f0'; dctx.font = '10px monospace';
    dctx.fillText(name, r.x+2, r.y+12);
  }
  document.body.appendChild(dbg);
  log('\\nDone! ' + Object.keys(window._results).length + ' buttons');
};
</script>
</body></html>
