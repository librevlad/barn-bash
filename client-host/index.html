<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <title>FRANTICS! — A Game Master Production</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-ui);
      background: var(--bg-wood-deep);
      color: var(--text-cream);
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* Full-screen background painting — carnival scene */
    #bg {
      position: fixed; inset: 0;
      background: url('/assets/bg.png') center/100% 100% no-repeat;
    }

    /* Sprite buttons from sliced PNGs */
    .btn-bar {
      position: fixed; bottom: 1vh; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: var(--z-base); align-items: flex-end;
      overflow: visible;
    }
    .sprite-btn {
      border: none; cursor: pointer; background: none; padding: 0;
      transition: transform var(--dur-tap) ease-out, filter var(--dur-instant);
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
      animation: btnFloat 3s ease-in-out infinite;
    }
    .sprite-btn img { display: block; height: 85px; width: auto; pointer-events: none; }
    .sprite-btn:hover {
      transform: scale(1.08) translateY(-4px);
      filter: drop-shadow(0 8px 25px rgba(255, 210, 50, 0.5)) brightness(1.05);
      animation: none;
    }
    .sprite-btn:active {
      transform: scale(0.94);
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
      animation: none;
    }
    #btn-play { animation-delay: 0s; }
    #btn-customize { animation-delay: 0.6s; }
    #btn-settings { animation-delay: 1.2s; }
    @keyframes btnFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* Top bar: connect URL + player count, over bg.png */
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 20px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.6) 0%, transparent 100%);
      pointer-events: none;
    }
    #top-bar > * { pointer-events: all; }
    .top-url {
      font-family: var(--font-mono);
      font-size: var(--fs-base); color: var(--text-cream);
      background: rgba(61, 40, 23, 0.72); backdrop-filter: blur(6px);
      padding: 6px 14px; border-radius: var(--radius-md);
      border: var(--border-thin) solid var(--accent-gold);
      box-shadow: var(--glow-gold-soft);
      cursor: pointer;
      transition: background var(--dur-short), border-color var(--dur-short);
    }
    .top-url:hover {
      background: rgba(61, 40, 23, 0.88);
      border-color: var(--accent-gold-hot);
    }
    .top-url-label {
      font-family: var(--font-accent);
      font-size: var(--fs-xs);
      color: var(--accent-gold);
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
    }
    .top-players {
      display: flex; gap: 8px; align-items: center;
    }

    /* Player pills — carnival-tinted glass pills */
    .player-pill {
      display: flex; align-items: center; gap: 4px;
      background: rgba(61, 40, 23, 0.72); backdrop-filter: blur(6px);
      padding: 4px 10px; border-radius: var(--radius-2xl);
      border: var(--border-hair) solid rgba(244, 197, 66, 0.4);
      font-family: var(--font-accent);
      font-size: var(--fs-base);
      color: var(--text-cream);
      box-shadow: var(--elevation-xs);
    }
    .player-pill-icon { font-size: 16px; display: inline-flex; align-items: center; }
    .player-pill-icon img.char-glyph {
      width: 22px; height: 22px; object-fit: contain;
      display: inline-block; vertical-align: middle;
      border-radius: 50%;
    }
    .player-pill-name {
      font-family: var(--font-accent);
      font-weight: 400;
      font-size: var(--fs-sm);
      letter-spacing: 0.5px;
    }
    .player-empty {
      background: rgba(0, 0, 0, 0.22);
      padding: 4px 12px; border-radius: var(--radius-2xl);
      border: 1px dashed rgba(244, 197, 66, 0.25);
      font-family: var(--font-accent);
      font-size: var(--fs-sm);
      color: var(--text-faint);
      letter-spacing: 1px;
    }

    /* Narrator quip — Game Master voice floating over bg */
    #narrator-idle {
      position: fixed; bottom: 14%; left: 50%; transform: translateX(-50%);
      font-family: var(--font-accent);
      font-size: var(--fs-lg);
      color: var(--text-cream);
      font-style: italic;
      text-align: center; max-width: 560px; z-index: 15;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85),
                   0 0 14px rgba(0, 0, 0, 0.5);
      transition: opacity var(--dur-pulse);
      pointer-events: none;
      letter-spacing: 0.3px;
    }

    /* Game select modal — frame.png + sprite tickets */
    #game-modal {
      display: none; position: fixed; inset: 0; z-index: var(--z-overlay);
      background: var(--scrim-heavy); backdrop-filter: blur(6px);
      align-items: center; justify-content: center;
    }
    #game-modal.show { display: flex; }
    .modal-box {
      position: relative;
      width: 720px; max-width: 92vw;
      height: 500px; max-height: 85vh;
      background: url('/assets/frame.png') center/100% 100% no-repeat;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 8% 12% 6% 12%;
      gap: 3px;
    }
    .modal-title {
      font-family: var(--font-display);
      font-size: var(--fs-xl);
      font-weight: 400;
      letter-spacing: var(--tracking-wide);
      color: var(--bg-wood-ink);
      text-transform: uppercase;
      text-shadow: 0 1px 0 var(--accent-gold-bulb),
                   0 2px 3px rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
    }
    .modal-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      width: 100%; flex: 1; min-height: 0;
    }
    .modal-btn {
      border: none; cursor: pointer; background: none; padding: 0;
      transition: transform var(--dur-tap), filter var(--dur-tap);
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
      overflow: hidden; position: relative;
      border-radius: var(--radius-sm);
    }
    .modal-btn img { display: block; width: 100%; height: 100%; object-fit: contain; position: absolute; inset: 0; }
    .modal-btn:hover { transform: scale(1.04); filter: drop-shadow(0 4px 12px rgba(255, 200, 50, 0.45)) brightness(1.05); }
    .modal-btn:active { transform: scale(0.95); filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.3)); }
    .modal-btn .card-label {
      position: absolute; bottom: 0; left: 0; right: 0;
      z-index: 1; padding: 18px 6px 5px 6px;
      text-align: center; pointer-events: none;
      background: linear-gradient(0deg,
                    rgba(0, 0, 0, 0.75) 0%,
                    rgba(0, 0, 0, 0.4) 60%,
                    transparent 100%);
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    }
    .card-label .card-name {
      display: block;
      font-family: var(--font-display);
      font-size: var(--fs-sm);
      font-weight: 400;
      letter-spacing: var(--tracking-norm);
      color: var(--text-cream);
      text-transform: uppercase;
      text-shadow: 0 1px 0 var(--bg-wood-ink),
                   0 2px 6px rgba(0, 0, 0, 0.9);
      line-height: var(--leading-tight);
    }
    .card-label .card-desc {
      display: block;
      font-family: var(--font-accent);
      font-size: var(--fs-xs);
      color: var(--accent-gold);
      opacity: 0.92;
      margin-top: 2px;
      font-style: italic;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }
    .card-label .card-icon { display: none; }
    .modal-bottom {
      display: flex; gap: 6px; align-items: stretch; width: 100%;
      flex-shrink: 0; height: 50px;
    }
    .modal-bottom .modal-btn { flex: 1; height: 100%; }
    /* BACK is a carnival-token pill that sits next to the tournament
       banner. No PNG frame fighting the red banner for visual weight;
       same height, proportional width, drawn with --accent-gold tokens
       so both pieces read as members of the same family. */
    .modal-bottom .modal-btn-back {
      flex: 0 0 auto;
      height: 50px;
      padding: 0 22px;
      background:
        linear-gradient(180deg, var(--accent-gold-hot) 0%, var(--accent-gold) 55%, var(--accent-gold-dim) 100%);
      color: var(--bg-wood-ink);
      font-family: var(--font-display);
      font-size: 15px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border: 2px solid var(--accent-gold-edge);
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
      text-shadow: 0 1px 0 var(--accent-gold-bulb);
      box-shadow:
        inset 0 1px 0 rgba(255, 248, 200, 0.55),
        0 2px 4px rgba(0, 0, 0, 0.35);
      transition: transform var(--dur-tap), filter var(--dur-tap);
    }
    .modal-bottom .modal-btn-back::before { content: '\2190'; font-size: 18px; }
    .modal-bottom .modal-btn-back:hover { transform: translateX(-2px); filter: brightness(1.07); }
    .modal-bottom .modal-btn-back:active { transform: translateX(-1px) scale(0.97); }
    .modal-need {
      font-family: var(--font-accent);
      font-size: var(--fs-sm);
      color: var(--warning-amber);
      font-weight: 400;
      font-style: italic;
      letter-spacing: 1px;
      display: none; flex-shrink: 0;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <h1 class="sr-only">Frantics — a Game Master production</h1>
  <div id="bg" role="img" aria-label="Barnyard Bedlam stage"></div>
  <!-- Dark gradient overlay to hide bg.png buttons at bottom -->
  <div style="position:fixed;inset:0;pointer-events:none;z-index:1;background:linear-gradient(180deg, transparent 0%, transparent 60%, rgba(0,0,0,0.85) 80%, rgba(0,0,0,1) 100%)"></div>

  <!-- Sprite buttons -->
  <div class="btn-bar">
    <button class="sprite-btn" id="btn-play" aria-label="Play"><img src="/assets/btn-play-normal.png" alt="" data-normal="/assets/btn-play-normal.png" data-hover="/assets/btn-play-hover.png" data-pressed="/assets/btn-play-pressed.png"></button>
    <button class="sprite-btn" id="btn-customize" aria-label="Customize"><img src="/assets/btn-customize-normal.png" alt="" data-normal="/assets/btn-customize-normal.png" data-hover="/assets/btn-customize-hover.png" data-pressed="/assets/btn-customize-pressed.png"></button>
    <button class="sprite-btn" id="btn-settings" aria-label="Settings"><img src="/assets/btn-settings-normal.png" alt="" data-normal="/assets/btn-settings-normal.png" data-hover="/assets/btn-settings-hover.png" data-pressed="/assets/btn-settings-pressed.png"></button>
  </div>

  <!-- Top bar: URL + players -->
  <div id="top-bar">
    <div class="top-url" id="connect-url" onclick="navigator.clipboard.writeText(this.dataset.url).then(()=>{this.querySelector('.top-url-label').textContent='COPIED!';setTimeout(()=>this.querySelector('.top-url-label').textContent='JOIN',1500)})">
      <div class="top-url-label">JOIN</div>
      <div id="connect-url-value" style="font-size:14px"></div>
    </div>
    <div class="top-players" id="lobby-players"></div>
  </div>

  <!-- Narrator -->
  <div id="narrator-idle"></div>

  <!-- Game select modal — frame + sprite buttons -->
  <div id="game-modal">
    <div class="modal-box">
      <div class="modal-title">Choose a Game</div>
      <div class="modal-need" id="modal-need">Need 2+ players to start</div>
      <div class="modal-grid">
        <button class="modal-btn" data-game="escapeFox">
          <img src="/assets/ticket-escape.png">
        </button>
        <button class="modal-btn" data-game="hillKing">
          <img src="/assets/ticket-hill.png">
        </button>
        <button class="modal-btn" data-game="meteor">
          <img src="/assets/ticket-meteor.png">
        </button>
        <button class="modal-btn" data-game="race">
          <img src="/assets/ticket-gp.png">
        </button>
      </div>
      <div class="modal-bottom">
        <button class="modal-btn-back" id="mh-back">BACK</button>
        <button class="modal-btn" id="mh-tournament">
          <img src="/assets/ticket-tourn.png">
        </button>
      </div>
    </div>
  </div>

  <script>
  // Preload all button states and swap on hover/press
  document.querySelectorAll('.sprite-btn img').forEach(img => {
    const normal = img.dataset.normal, hover = img.dataset.hover, pressed = img.dataset.pressed;
    [hover, pressed].forEach(src => { const i = new Image(); i.src = src; }); // preload
  });
  document.querySelectorAll('.sprite-btn').forEach(btn => {
    const img = btn.querySelector('img');
    btn.addEventListener('mouseenter', () => { img.src = img.dataset.hover; });
    btn.addEventListener('mouseleave', () => { img.src = img.dataset.normal; });
    btn.addEventListener('mousedown',  () => { img.src = img.dataset.pressed; });
    btn.addEventListener('mouseup',    () => { img.src = img.dataset.hover; });
  });
  </script>
  <script src="/shared/icons.js"></script>
  <script src="/engine/SpriteLoader.js"></script>
  <script src="/shared/host-common.js"></script>
  <script src="/shared/narrator.js"></script>
  <script src="/shared/sound.js"></script>
  <script src="/shared/transitions.js"></script>
  <script src="/shared/tournament.js"></script>
  <script src="main.js"></script>
</body>
</html>
