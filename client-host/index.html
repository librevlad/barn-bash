<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FRANTICS! — A Game Master Production</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: #1a3a1a;
      color: #eee;
    }

    /* Full-screen background — stretch to fill, no crop */
    #bg {
      position: fixed; inset: 0;
      background: url('/assets/bg.png') center/100% 100% no-repeat;
    }

    /* Sprite buttons from sliced PNGs */
    .btn-bar {
      position: fixed; bottom: 1vh; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 10; align-items: flex-end;
      overflow: visible;
    }
    .sprite-btn {
      border: none; cursor: pointer; background: none; padding: 0;
      transition: transform 0.12s ease-out, filter 0.15s;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
      animation: btnFloat 3s ease-in-out infinite;
    }
    .sprite-btn img { display: block; height: 85px; width: auto; pointer-events: none; }
    .sprite-btn:hover {
      transform: scale(1.08) translateY(-4px);
      filter: drop-shadow(0 8px 25px rgba(255,210,50,0.5)) brightness(1.05);
      animation: none;
    }
    .sprite-btn:active {
      transform: scale(0.94);
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
      animation: none;
    }
    #btn-play { animation-delay: 0s; }
    #btn-customize { animation-delay: 0.6s; }
    #btn-settings { animation-delay: 1.2s; }
    @keyframes btnFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* Top bar: connect URL + player count */
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
      pointer-events: none;
    }
    #top-bar > * { pointer-events: all; }
    .top-url {
      font-size: 13px; color: rgba(255,255,255,0.8);
      font-family: 'SF Mono', 'Consolas', monospace;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(6px);
      padding: 6px 14px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      cursor: pointer;
    }
    .top-url:hover { background: rgba(0,0,0,0.6); }
    .top-url-label { font-size: 9px; color: rgba(255,255,255,0.5); letter-spacing: 2px; text-transform: uppercase; }
    .top-players {
      display: flex; gap: 8px; align-items: center;
    }

    /* Player pills */
    .player-pill {
      display: flex; align-items: center; gap: 4px;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(6px);
      padding: 4px 10px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      font-size: 13px;
    }
    .player-pill-icon { font-size: 16px; }
    .player-pill-name { font-weight: 700; font-size: 12px; }
    .player-empty {
      background: rgba(0,0,0,0.2);
      padding: 4px 12px; border-radius: 20px;
      border: 1px dashed rgba(255,255,255,0.1);
      font-size: 11px; color: rgba(255,255,255,0.3);
    }

    /* Narrator quip */
    #narrator-idle {
      position: fixed; bottom: 14%; left: 50%; transform: translateX(-50%);
      font-size: 14px; color: rgba(255,255,255,0.85); font-style: italic;
      text-align: center; max-width: 500px; z-index: 15;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      transition: opacity 0.4s;
      pointer-events: none;
    }

    /* Game select modal — frame + sprite buttons */
    #game-modal {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
      align-items: center; justify-content: center;
    }
    #game-modal.show { display: flex; }
    .modal-box {
      position: relative;
      width: 720px; max-width: 92vw;
      height: 500px; max-height: 85vh;
      background: url('/assets/frame.png') center/100% 100% no-repeat;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 8% 12% 6% 12%;
      gap: 3px;
    }
    .modal-title {
      font-size: 16px; font-weight: 900; letter-spacing: 3px;
      color: #4a2a0a; text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255,255,255,0.4);
      font-family: 'Georgia', serif;
      flex-shrink: 0;
    }
    .modal-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      width: 100%; flex: 1; min-height: 0;
    }
    .modal-btn {
      border: none; cursor: pointer; background: none; padding: 0;
      transition: transform 0.1s, filter 0.12s;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      overflow: hidden; position: relative;
      border-radius: 6px;
    }
    .modal-btn img { display: block; width: 100%; height: 100%; object-fit: contain; position: absolute; inset: 0; }
    .modal-btn:hover { transform: scale(1.04); filter: drop-shadow(0 4px 12px rgba(255,200,50,0.4)) brightness(1.05); }
    .modal-btn:active { transform: scale(0.95); filter: drop-shadow(0 1px 3px rgba(0,0,0,0.3)); }
    .modal-btn .card-label {
      position: absolute; bottom: 0; left: 0; right: 0;
      z-index: 1; padding: 18px 6px 5px 6px;
      text-align: center; pointer-events: none;
      background: linear-gradient(0deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
      border-radius: 0 0 6px 6px;
    }
    .card-label .card-name {
      display: block;
      font-size: 11px; font-weight: 900; letter-spacing: 1px;
      color: #fff; text-transform: uppercase;
      font-family: 'Georgia', serif;
      line-height: 1.15;
    }
    .card-label .card-desc {
      display: block;
      font-size: 8px; color: rgba(255,255,255,0.65);
      margin-top: 1px; font-style: italic;
    }
    .card-label .card-icon { display: none; }
    .modal-bottom {
      display: flex; gap: 6px; align-items: center; width: 100%;
      flex-shrink: 0; height: 50px;
    }
    .modal-bottom .modal-btn { flex: 1; height: 100%; }
    .modal-bottom .modal-btn-back { flex: 0 0 120px; height: 50px; }
    .modal-bottom .modal-btn-back img { width: 120px; height: 50px; object-fit: contain; }
    .modal-need {
      font-size: 10px; color: #993322; font-weight: 700; font-style: italic;
      display: none; flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="bg"></div>
  <!-- Dark gradient overlay to hide bg.png buttons at bottom -->
  <div style="position:fixed;inset:0;pointer-events:none;z-index:1;background:linear-gradient(180deg, transparent 0%, transparent 60%, rgba(0,0,0,0.85) 80%, rgba(0,0,0,1) 100%)"></div>

  <!-- Sprite buttons -->
  <div class="btn-bar">
    <button class="sprite-btn" id="btn-play"><img src="/assets/btn-play-normal.png" data-normal="/assets/btn-play-normal.png" data-hover="/assets/btn-play-hover.png" data-pressed="/assets/btn-play-pressed.png"></button>
    <button class="sprite-btn" id="btn-customize"><img src="/assets/btn-customize-normal.png" data-normal="/assets/btn-customize-normal.png" data-hover="/assets/btn-customize-hover.png" data-pressed="/assets/btn-customize-pressed.png"></button>
    <button class="sprite-btn" id="btn-settings"><img src="/assets/btn-settings-normal.png" data-normal="/assets/btn-settings-normal.png" data-hover="/assets/btn-settings-hover.png" data-pressed="/assets/btn-settings-pressed.png"></button>
  </div>

  <!-- Top bar: URL + players -->
  <div id="top-bar">
    <div class="top-url" id="connect-url" onclick="navigator.clipboard.writeText(this.dataset.url).then(()=>{this.querySelector('.top-url-label').textContent='COPIED!';setTimeout(()=>this.querySelector('.top-url-label').textContent='JOIN',1500)})">
      <div class="top-url-label">JOIN</div>
      <div id="connect-url-value" style="font-size:14px"></div>
    </div>
    <div class="top-players" id="lobby-players"></div>
  </div>

  <!-- Narrator -->
  <div id="narrator-idle"></div>

  <!-- Game select modal — frame + sprite buttons -->
  <div id="game-modal">
    <div class="modal-box">
      <div class="modal-title">Choose a Game</div>
      <div class="modal-need" id="modal-need">Need 2+ players to start</div>
      <div class="modal-grid">
        <button class="modal-btn" data-game="escapeFox">
          <img src="/assets/ticket-normal.png" data-n="/assets/ticket-normal.png" data-h="/assets/ticket-hover.png" data-p="/assets/ticket-pressed.png">
          <div class="card-label"><span class="card-name">Escape the Fox</span><span class="card-desc">Run. Don't look back.</span></div>
        </button>
        <button class="modal-btn" data-game="hillKing">
          <img src="/assets/ticket-normal.png" data-n="/assets/ticket-normal.png" data-h="/assets/ticket-hover.png" data-p="/assets/ticket-pressed.png">
          <div class="card-label"><span class="card-name">King of the Hill</span><span class="card-desc">Push or be pushed.</span></div>
        </button>
        <button class="modal-btn" data-game="meteor">
          <img src="/assets/ticket-normal.png" data-n="/assets/ticket-normal.png" data-h="/assets/ticket-hover.png" data-p="/assets/ticket-pressed.png">
          <div class="card-label"><span class="card-name">Meteor Shower</span><span class="card-desc">Find shelter. Fast.</span></div>
        </button>
        <button class="modal-btn" data-game="race">
          <img src="/assets/ticket-normal.png" data-n="/assets/ticket-normal.png" data-h="/assets/ticket-hover.png" data-p="/assets/ticket-pressed.png">
          <div class="card-label"><span class="card-name">Grand Prix</span><span class="card-desc">3 laps. No brakes.</span></div>
        </button>
      </div>
      <div class="modal-bottom">
        <button class="modal-btn modal-btn-back" id="mh-back">
          <img src="/assets/back-normal.png" data-n="/assets/back-normal.png" data-h="/assets/back-hover.png" data-p="/assets/back-pressed.png">
        </button>
        <button class="modal-btn" id="mh-tournament">
          <img src="/assets/tourn-normal.png" data-n="/assets/tourn-normal.png" data-h="/assets/tourn-hover.png" data-p="/assets/tourn-pressed.png">
        </button>
      </div>
    </div>
  </div>

  <script>
  // Preload all button states and swap on hover/press
  document.querySelectorAll('.sprite-btn img').forEach(img => {
    const normal = img.dataset.normal, hover = img.dataset.hover, pressed = img.dataset.pressed;
    [hover, pressed].forEach(src => { const i = new Image(); i.src = src; }); // preload
  });
  document.querySelectorAll('.sprite-btn').forEach(btn => {
    const img = btn.querySelector('img');
    btn.addEventListener('mouseenter', () => { img.src = img.dataset.hover; });
    btn.addEventListener('mouseleave', () => { img.src = img.dataset.normal; });
    btn.addEventListener('mousedown',  () => { img.src = img.dataset.pressed; });
    btn.addEventListener('mouseup',    () => { img.src = img.dataset.hover; });
  });
  </script>
  <script src="/shared/narrator.js"></script>
  <script src="/shared/sound.js"></script>
  <script src="/shared/transitions.js"></script>
  <script src="/shared/tournament.js"></script>
  <script src="main.js"></script>
</body>
</html>
