<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FRANTICS! — A Game Master Production</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: #1a3a1a;
      color: #eee;
    }

    /* Full-screen background image */
    #bg {
      position: fixed; inset: 0;
      background: url('/assets/bg.png') center/cover no-repeat;
    }

    /* Hotspot buttons — positioned over the buttons already in bg.png */
    .hotspot {
      position: absolute;
      cursor: pointer; border: none; background: transparent;
      z-index: 10; border-radius: 12px;
      transition: transform 0.12s, box-shadow 0.2s;
    }
    .hotspot:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px 8px rgba(255,220,100,0.4);
      background: rgba(255,220,100,0.08);
    }
    .hotspot:active {
      transform: scale(0.95);
      box-shadow: 0 0 10px 2px rgba(255,220,100,0.2);
      background: rgba(0,0,0,0.1);
    }
    /* Pulsing glow animation */
    .hotspot::after {
      content: ''; position: absolute; inset: -3px;
      border-radius: 14px; pointer-events: none;
      box-shadow: 0 0 12px 2px rgba(255,255,255,0.15);
      animation: hotPulse 2.5s ease-in-out infinite;
    }
    .hotspot:hover::after { animation: none; box-shadow: 0 0 20px 4px rgba(255,220,100,0.3); }
    @keyframes hotPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    /* Positions over bg.png buttons (% of viewport) */
    #btn-play       { left: 20.5%; bottom: 1.5%; width: 17.5%; height: 8.5%; animation-delay: 0s; }
    #btn-customize  { left: 40%;   bottom: 1.5%; width: 20%;   height: 8.5%; animation-delay: 0.8s; }
    #btn-settings   { left: 62%;   bottom: 1.5%; width: 17.5%; height: 8.5%; animation-delay: 1.6s; }
    #btn-play::after { animation-delay: 0s; }
    #btn-customize::after { animation-delay: 0.8s; }
    #btn-settings::after { animation-delay: 1.6s; }

    /* Top bar: connect URL + player count */
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
      pointer-events: none;
    }
    #top-bar > * { pointer-events: all; }
    .top-url {
      font-size: 13px; color: rgba(255,255,255,0.8);
      font-family: 'SF Mono', 'Consolas', monospace;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(6px);
      padding: 6px 14px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      cursor: pointer;
    }
    .top-url:hover { background: rgba(0,0,0,0.6); }
    .top-url-label { font-size: 9px; color: rgba(255,255,255,0.5); letter-spacing: 2px; text-transform: uppercase; }
    .top-players {
      display: flex; gap: 8px; align-items: center;
    }

    /* Player pills */
    .player-pill {
      display: flex; align-items: center; gap: 4px;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(6px);
      padding: 4px 10px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      font-size: 13px;
    }
    .player-pill-icon { font-size: 16px; }
    .player-pill-name { font-weight: 700; font-size: 12px; }
    .player-empty {
      background: rgba(0,0,0,0.2);
      padding: 4px 12px; border-radius: 20px;
      border: 1px dashed rgba(255,255,255,0.1);
      font-size: 11px; color: rgba(255,255,255,0.3);
    }

    /* Narrator quip */
    #narrator-idle {
      position: fixed; bottom: 14%; left: 50%; transform: translateX(-50%);
      font-size: 14px; color: rgba(255,255,255,0.85); font-style: italic;
      text-align: center; max-width: 500px; z-index: 15;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      transition: opacity 0.4s;
      pointer-events: none;
    }

    /* Game select modal (shown on PLAY click) */
    #game-modal {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
      align-items: center; justify-content: center;
    }
    #game-modal.show { display: flex; }
    .modal-box {
      background: rgba(20,20,30,0.95); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px; padding: 28px 24px; max-width: 520px; width: 90%;
      text-align: center;
    }
    .modal-title { font-size: 13px; letter-spacing: 4px; color: rgba(255,255,255,0.5); text-transform: uppercase; margin-bottom: 18px; }
    .modal-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .modal-card {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 16px 12px; cursor: pointer;
      transition: all 0.2s; text-align: center;
    }
    .modal-card:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
    .modal-card-icon { font-size: 28px; margin-bottom: 6px; }
    .modal-card-name { font-size: 13px; font-weight: 800; letter-spacing: 1px; margin-bottom: 3px; }
    .modal-card-desc { font-size: 10px; color: rgba(255,255,255,0.5); }
    .modal-card[data-game="escapeFox"] .modal-card-name { color: #ff7744; }
    .modal-card[data-game="hillKing"] .modal-card-name { color: #c088ff; }
    .modal-card[data-game="meteor"] .modal-card-name { color: #ff8844; }
    .modal-card[data-game="race"] .modal-card-name { color: #66ff66; }
    .modal-tournament {
      grid-column: 1 / -1; margin-top: 4px;
      background: rgba(255,200,50,0.08); border: 1px solid rgba(255,200,50,0.25);
      border-radius: 12px; padding: 14px; cursor: pointer;
      transition: all 0.2s; text-align: center;
    }
    .modal-tournament:hover { background: rgba(255,200,50,0.15); transform: translateY(-2px); }
    .modal-tournament-name { font-size: 14px; font-weight: 900; color: #ffd700; letter-spacing: 2px; }
    .modal-tournament-desc { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 2px; }
    .modal-close {
      margin-top: 16px; padding: 8px 24px;
      background: none; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
      color: rgba(255,255,255,0.5); font-size: 12px; cursor: pointer;
      font-family: inherit;
    }
    .modal-close:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .modal-need { font-size: 11px; color: rgba(255,100,100,0.8); margin-bottom: 14px; display: none; }
  </style>
</head>
<body>
  <div id="bg"></div>

  <!-- Hotspot buttons over bg.png's built-in buttons -->
  <div class="hotspot" id="btn-play"></div>
  <div class="hotspot" id="btn-customize"></div>
  <div class="hotspot" id="btn-settings"></div>

  <!-- Top bar: URL + players -->
  <div id="top-bar">
    <div class="top-url" id="connect-url" onclick="navigator.clipboard.writeText(this.dataset.url).then(()=>{this.querySelector('.top-url-label').textContent='COPIED!';setTimeout(()=>this.querySelector('.top-url-label').textContent='JOIN',1500)})">
      <div class="top-url-label">JOIN</div>
      <div id="connect-url-value" style="font-size:14px"></div>
    </div>
    <div class="top-players" id="lobby-players"></div>
  </div>

  <!-- Narrator -->
  <div id="narrator-idle"></div>

  <!-- Game select modal -->
  <div id="game-modal">
    <div class="modal-box">
      <div class="modal-title">Choose a Game</div>
      <div class="modal-need" id="modal-need">Need 2+ players to start</div>
      <div class="modal-grid" id="game-grid">
        <div class="modal-card" data-game="escapeFox">
          <div class="modal-card-icon">&#129418;</div>
          <div class="modal-card-name">ESCAPE THE FOX</div>
          <div class="modal-card-desc">Run. Don't look back.</div>
        </div>
        <div class="modal-card" data-game="hillKing">
          <div class="modal-card-icon">&#128081;</div>
          <div class="modal-card-name">KING OF THE HILL</div>
          <div class="modal-card-desc">Push or be pushed.</div>
        </div>
        <div class="modal-card" data-game="meteor">
          <div class="modal-card-icon">&#9732;</div>
          <div class="modal-card-name">METEOR SHOWER</div>
          <div class="modal-card-desc">Find shelter. Fast.</div>
        </div>
        <div class="modal-card" data-game="race">
          <div class="modal-card-icon">&#127937;</div>
          <div class="modal-card-name">GRAND PRIX</div>
          <div class="modal-card-desc">3 laps. No brakes.</div>
        </div>
        <div class="modal-tournament" id="btn-tournament">
          <div class="modal-tournament-name">&#127942; TOURNAMENT</div>
          <div class="modal-tournament-desc">3 rounds. One champion.</div>
        </div>
      </div>
      <button class="modal-close" id="modal-close">Back</button>
    </div>
  </div>

  <script>/* hotspot buttons — no sprite JS needed, visuals are in bg.png */</script>
  <script src="/shared/narrator.js"></script>
  <script src="/shared/sound.js"></script>
  <script src="/shared/transitions.js"></script>
  <script src="/shared/tournament.js"></script>
  <script src="main.js"></script>
</body>
</html>
