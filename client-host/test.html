<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Frantics — Test Mode</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111; color: #eee;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      height: 100vh; display: flex; flex-direction: column;
      overflow: hidden;
    }
    #top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 16px; background: #1a1a2e; flex-shrink: 0;
      border-bottom: 1px solid #333;
    }
    #top-bar h1 { font-size: 13px; letter-spacing: 3px; color: #888; font-weight: 400; }
    .top-info { font-size: 11px; color: #666; }
    #frames {
      flex: 1; display: flex; gap: 2px; background: #000;
    }
    .frame-wrap {
      display: flex; flex-direction: column; overflow: hidden;
    }
    #host-wrap { flex: 1; min-width: 0; }
    #ctrls-wrap {
      flex: 0 0 400px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .ctrl-frame { flex: 1; min-height: 0; }
    .frame-label {
      font-size: 10px; letter-spacing: 2px; color: #555; padding: 4px 10px;
      background: #0a0a14; text-transform: uppercase; flex-shrink: 0;
    }
    iframe {
      flex: 1; border: none; width: 100%; background: #000;
    }
  </style>
</head>
<body>
  <div id="top-bar">
    <h1>FRANTICS TEST MODE</h1>
    <div class="top-info">Host + 2 controllers on one screen</div>
  </div>
  <div id="frames">
    <div class="frame-wrap" id="host-wrap">
      <div class="frame-label">Host</div>
      <iframe id="host-frame" src="/host/"></iframe>
    </div>
    <div class="frame-wrap" id="ctrls-wrap">
      <div class="frame-wrap ctrl-frame">
        <div class="frame-label">Controller 1</div>
        <iframe id="ctrl1-frame" src="/controller/?slot=1"></iframe>
      </div>
      <div class="frame-wrap ctrl-frame">
        <div class="frame-label">Controller 2</div>
        <iframe id="ctrl2-frame" src="/controller/?slot=2"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
