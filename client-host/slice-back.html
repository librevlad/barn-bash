<!DOCTYPE html>
<html><head><title>Back Button Slicer</title></head>
<body style="background:#222;color:#eee;font-family:monospace;padding:16px">
<pre id="log"></pre>
<div id="previews" style="display:flex;gap:8px;margin-top:12px"></div>
<script>
const log = s => { document.getElementById('log').textContent += s + '\n'; };
const FILES = [
  { src: '/assets/back-normal.png', name: 'back-normal' },
  { src: '/assets/back-hover.png', name: 'back-hover' },
  { src: '/assets/back-pressed.png', name: 'back-pressed' },
];
window._results = {};
let done = 0;

FILES.forEach(f => {
  const img = new Image();
  img.src = f.src;
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const id = ctx.getImageData(0, 0, c.width, c.height);
    const d = id.data;
    const bgR = d[0], bgG = d[1], bgB = d[2];
    log(f.name + ': ' + c.width + 'x' + c.height + ' bg=(' + bgR + ',' + bgG + ',' + bgB + ')');
    for (let i = 0; i < d.length; i += 4) {
      const dr = Math.abs(d[i]-bgR), dg = Math.abs(d[i+1]-bgG), db = Math.abs(d[i+2]-bgB);
      const maxD = Math.max(dr, dg, db);
      if (maxD < 30) d[i+3] = 0;
      else if (maxD < 55) d[i+3] = Math.round(255 * (maxD-30) / 25);
    }
    ctx.putImageData(id, 0, 0);
    window._results[f.name] = c.toDataURL('image/png');

    const div = document.createElement('div');
    div.style.cssText = 'background:#444;padding:6px;border-radius:8px;text-align:center';
    div.innerHTML = '<div style="font-size:10px;color:#aaa">' + f.name + '</div>';
    const p = new Image(); p.src = window._results[f.name]; p.style.height = '50px';
    div.appendChild(p);
    document.getElementById('previews').appendChild(div);

    if (++done === FILES.length) log('\\nDone!');
  };
});
</script>
</body></html>
