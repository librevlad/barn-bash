<!DOCTYPE html>
<html><head><title>Tournament Slicer</title></head>
<body style="background:#222;color:#eee;font-family:monospace;padding:16px">
<pre id="log"></pre>
<div id="previews" style="display:flex;gap:8px;margin-top:12px"></div>
<script>
const log = s => { document.getElementById('log').textContent += s + '\n'; };
const FILES = [
  { src: '/assets/tourn-normal-raw.png', name: 'tourn-normal' },
  { src: '/assets/tourn-hover-raw.png', name: 'tourn-hover' },
  { src: '/assets/tourn-pressed-raw.png', name: 'tourn-pressed' },
];
window._results = {};
let done = 0;

FILES.forEach(f => {
  const img = new Image();
  img.src = f.src;
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const id = ctx.getImageData(0, 0, c.width, c.height);
    const d = id.data;
    // Sample bg from corner
    const bgR = d[0], bgG = d[1], bgB = d[2];
    log(f.name + ': ' + c.width + 'x' + c.height + ' bg=(' + bgR + ',' + bgG + ',' + bgB + ')');
    for (let i = 0; i < d.length; i += 4) {
      const dr = Math.abs(d[i]-bgR), dg = Math.abs(d[i+1]-bgG), db = Math.abs(d[i+2]-bgB);
      const maxD = Math.max(dr, dg, db);
      if (maxD < 25) d[i+3] = 0;
      else if (maxD < 50) d[i+3] = Math.round(255 * (maxD-25) / 25);
    }
    ctx.putImageData(id, 0, 0);

    // Trim transparent edges
    let minX = c.width, maxX = 0, minY = c.height, maxY = 0;
    const td = ctx.getImageData(0, 0, c.width, c.height).data;
    for (let y = 0; y < c.height; y++) {
      for (let x = 0; x < c.width; x++) {
        if (td[(y * c.width + x) * 4 + 3] > 10) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }
    // Pad 2px
    minX = Math.max(0, minX - 2); minY = Math.max(0, minY - 2);
    maxX = Math.min(c.width, maxX + 3); maxY = Math.min(c.height, maxY + 3);
    const tw = maxX - minX, th = maxY - minY;

    const tc = document.createElement('canvas');
    tc.width = tw; tc.height = th;
    tc.getContext('2d').drawImage(c, minX, minY, tw, th, 0, 0, tw, th);

    window._results[f.name] = tc.toDataURL('image/png');
    log('  trimmed: ' + tw + 'x' + th);

    const div = document.createElement('div');
    div.style.cssText = 'background:#444;padding:6px;border-radius:8px;text-align:center';
    div.innerHTML = '<div style="font-size:10px;color:#aaa">' + f.name + '</div>';
    const p = new Image(); p.src = window._results[f.name]; p.style.height = '40px';
    div.appendChild(p);
    document.getElementById('previews').appendChild(div);

    if (++done === FILES.length) log('\\nDone!');
  };
});
</script>
</body></html>
