<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Frantics — Controller</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; touch-action: none; }
    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: #222; color: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none;
      transition: transform 0.08s ease-out;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: rgba(0,0,0,0.15);
      pointer-events: none;
    }

    #game-name {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      font-size: 9px; letter-spacing: 4px; opacity: 0.4;
    }
    #info { font-size: 18px; opacity: 0.85; }
    #score {
      font-size: 64px; font-weight: 800; margin: 6px 0;
      text-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    #result {
      font-size: 36px; font-weight: 700; min-height: 44px;
      transition: transform 0.15s;
    }
    #result.correct { color: #d5ffd5; }
    #result.wrong   { color: #ffd5d5; }
    #result.pop { transform: scale(1.2); }
    #status { font-size: 14px; opacity: 0.7; margin-top: 4px; min-height: 22px; }

    /* Gesture indicator */
    #gesture-hint {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      font-size: 10px; letter-spacing: 2px; opacity: 0.3;
      text-align: center;
    }

    /* Swipe arrow flash */
    #swipe-arrow {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 60px; pointer-events: none;
      opacity: 0; transition: opacity 0.15s;
    }
    #swipe-arrow.show { opacity: 0.5; }

    /* Cooldown bar */
    #cooldown-wrap {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: 50%; max-width: 180px; height: 3px;
      background: rgba(0,0,0,0.3); border-radius: 2px; display: none;
    }
    #cooldown-fill {
      height: 100%; width: 100%; border-radius: 2px;
      background: rgba(255,255,255,0.6); transition: width 0.1s linear;
    }

    /* Tap pulse */
    #tap-pulse {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 100px; height: 100px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.3);
      pointer-events: none; opacity: 0;
    }
    #tap-pulse.active { animation: tapRing 0.3s ease-out; }
    @keyframes tapRing {
      0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.5); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
    }

    /* Hold charge */
    #hold-ring {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 90px; height: 90px; border-radius: 50%;
      border: 4px solid rgba(255,255,100,0); pointer-events: none;
      transition: border-color 0.2s;
    }
    #hold-ring.charging {
      border-color: rgba(255,255,100,0.5);
      animation: holdPulse 0.8s ease-in-out infinite;
    }
    @keyframes holdPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.1); }
    }

    /* Desktop D-pad */
    #dpad {
      position: fixed; bottom: 8px; right: 8px;
      display: grid; grid-template-columns: 36px 36px 36px; grid-template-rows: 36px 36px 36px;
      gap: 3px; z-index: 40;
    }
    .dpad-btn {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.15);
      color: #fff; font-size: 14px; border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0; -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }
    .dpad-btn:active { background: rgba(255,255,255,0.3); }
    .dpad-up   { grid-column: 2; grid-row: 1; }
    .dpad-left  { grid-column: 1; grid-row: 2; }
    .dpad-tap   { grid-column: 2; grid-row: 2; font-size: 9px; font-weight: 700; background: rgba(255,255,255,0.2); }
    .dpad-right { grid-column: 3; grid-row: 2; }
    .dpad-down  { grid-column: 2; grid-row: 3; }
    .dpad-hold  { grid-column: 1; grid-row: 3; font-size: 8px; font-weight: 600; grid-column: 1 / 2; }

    /* Hide dpad on real touch devices */
    @media (hover: none) and (pointer: coarse) {
      #dpad { display: none; }
    }
  </style>
</head>
<body>
  <!-- Onboarding overlay -->
  <div id="onboarding" style="position:fixed;inset:0;z-index:200;background:#1a1a2a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;transition:opacity 0.4s">
    <div style="font-size:32px;font-weight:900;background:linear-gradient(135deg,#ff6633,#ff3366,#cc33ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px">FRANTICS!</div>
    <div style="font-size:10px;letter-spacing:3px;color:#555;text-transform:uppercase;margin-bottom:24px">A Game Master Production</div>

    <!-- Step 1: Name -->
    <div id="ob-step-name">
      <div style="color:#aaa;font-size:14px;margin-bottom:10px;text-align:center">Your name, contestant:</div>
      <input id="ob-name" type="text" maxlength="16" placeholder="Enter name..." autocomplete="off"
        style="width:220px;padding:12px 16px;border:2px solid #444;border-radius:10px;background:#111;color:#fff;font-size:18px;text-align:center;outline:none;font-family:inherit" />
      <button id="ob-name-btn" style="display:block;width:220px;margin-top:12px;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#ff3366,#cc33ff);color:white;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">NEXT</button>
      <div style="color:#555;font-size:10px;font-style:italic;text-align:center;margin-top:14px">"Make it memorable. You won't be here long."</div>
    </div>

    <!-- Step 2: Character (hidden initially) -->
    <div id="ob-step-char" style="display:none;width:100%;max-width:260px">
      <div style="color:#aaa;font-size:14px;margin-bottom:12px;text-align:center">Choose your fighter:</div>
      <div id="ob-chars" style="display:flex;flex-direction:column;gap:8px"></div>
      <div id="ob-char-quip" style="color:#555;font-size:10px;font-style:italic;text-align:center;margin-top:14px"></div>
    </div>
  </div>

  <div id="game-name"></div>
  <div id="info">Connecting...</div>
  <div id="score">0</div>
  <div id="result"></div>
  <div id="status"></div>
  <div id="gesture-hint"></div>
  <div id="swipe-arrow"></div>

  <!-- Desktop D-pad for testing swipes with mouse -->
  <div id="dpad">
    <button class="dpad-btn dpad-up" data-dir="up">&#9650;</button>
    <button class="dpad-btn dpad-left" data-dir="left">&#9664;</button>
    <button class="dpad-btn dpad-tap" data-dir="tap">TAP</button>
    <button class="dpad-btn dpad-right" data-dir="right">&#9654;</button>
    <button class="dpad-btn dpad-down" data-dir="down">&#9660;</button>
    <button class="dpad-btn dpad-hold" data-dir="hold">HOLD</button>
  </div>
  <div id="cooldown-wrap"><div id="cooldown-fill"></div></div>
  <div id="tap-pulse"></div>
  <div id="hold-ring"></div>
  <script src="/shared/sound.js"></script>
  <script src="main.js"></script>
</body>
</html>
