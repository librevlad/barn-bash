<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3d2817">
  <title>Frantics — Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Cutive&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/controller/onboarding.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; touch-action: none; }
    body {
      font-family: var(--font-ui);
      background-color: var(--bg-wood-deep);
      background-image: var(--bg-wood-plank);
      color: var(--text-cream);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none;
      transition: transform 0.08s ease-out;
    }

    #game-name {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      font-family: var(--font-accent);
      font-size: var(--fs-xs); letter-spacing: var(--tracking-widest);
      color: var(--text-dim); text-transform: uppercase;
    }
    #info {
      font-family: var(--font-accent);
      font-size: var(--fs-md); font-style: italic;
      color: var(--text-cream);
    }
    #score {
      font-family: var(--font-display);
      font-size: 64px;
      color: var(--accent-gold);
      text-shadow: var(--text-shadow-stack);
      letter-spacing: var(--tracking-tight);
      margin: 6px 0;
    }
    #result {
      font-family: var(--font-display);
      font-size: var(--fs-4xl);
      min-height: 44px;
      transition: transform 0.15s;
      letter-spacing: var(--tracking-norm);
    }
    #result.correct { color: var(--success-green); text-shadow: 0 0 12px rgba(123,201,80,0.5); }
    #result.wrong   { color: var(--danger-red);   text-shadow: 0 0 12px rgba(217,83,79,0.5); }
    #result.pop { transform: scale(1.2); }
    #status {
      font-family: var(--font-accent);
      font-size: var(--fs-sm);
      color: var(--text-dim);
      margin-top: 4px; min-height: 22px;
      letter-spacing: var(--tracking-norm);
    }

    /* Gesture indicator — wood pill with gold border */
    #gesture-hint {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      font-family: var(--font-accent);
      font-size: var(--fs-sm); letter-spacing: var(--tracking-norm);
      color: var(--text-cream);
      text-align: center; max-width: 90%;
      background: var(--bg-wood-warm);
      border: var(--border-thin) solid var(--accent-gold);
      padding: 6px 14px; border-radius: var(--radius-md);
      box-shadow: var(--elevation-sm);
    }

    /* Swipe arrow flash — gold */
    #swipe-arrow {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 60px; pointer-events: none;
      opacity: 0; transition: opacity 0.15s;
      color: var(--accent-gold-hot);
      text-shadow: 0 0 20px var(--accent-gold-hot);
    }
    #swipe-arrow.show { opacity: 0.7; }

    /* Cooldown bar — wood track with gold fill */
    #cooldown-wrap {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: 50%; max-width: 180px; height: 4px;
      background: var(--bg-wood-warm); border-radius: 2px; display: none;
      box-shadow: var(--inset-wood);
    }
    #cooldown-fill {
      height: 100%; width: 100%; border-radius: 2px;
      background: var(--bg-ticket-face);
      box-shadow: 0 0 6px rgba(244,197,66,0.5);
      transition: width 0.1s linear;
    }

    /* Tap pulse — gold ring */
    #tap-pulse {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 100px; height: 100px; border-radius: 50%;
      border: var(--border-thick) solid var(--accent-gold-hot);
      pointer-events: none; opacity: 0;
    }
    #tap-pulse.active { animation: tapRing 0.3s ease-out; }
    @keyframes tapRing {
      0% { opacity: 0.8; transform: translate(-50%, -50%) scale(0.5); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
    }

    /* Hold charge — gold ring */
    #hold-ring {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 90px; height: 90px; border-radius: 50%;
      border: 4px solid rgba(255, 221, 107, 0); pointer-events: none;
      transition: border-color var(--dur-short);
    }
    #hold-ring.charging {
      border-color: var(--accent-gold-hot);
      box-shadow: 0 0 12px rgba(255,221,107,0.5);
      animation: holdPulse 0.8s ease-in-out infinite;
    }
    @keyframes holdPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.1); }
    }

    /* Desktop D-pad (dev helper, hidden on touch) */
    #dpad {
      position: fixed; bottom: 8px; right: 8px;
      display: grid; grid-template-columns: 36px 36px 36px; grid-template-rows: 36px 36px 36px;
      gap: 3px; z-index: 40;
    }
    .dpad-btn {
      background: var(--bg-wood-warm);
      border: var(--border-hair) solid var(--accent-gold-edge);
      color: var(--text-cream);
      font-family: var(--font-ui);
      font-size: 14px; border-radius: var(--radius-sm); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0; -webkit-tap-highlight-color: transparent;
      transition: background var(--dur-tap);
    }
    .dpad-btn:active { background: var(--accent-gold); color: var(--text-on-gold); }
    .dpad-up   { grid-column: 2; grid-row: 1; }
    .dpad-left  { grid-column: 1; grid-row: 2; }
    .dpad-tap   { grid-column: 2; grid-row: 2; font-size: 9px; font-weight: 700;
                  background: var(--accent-gold); color: var(--text-on-gold); }
    .dpad-right { grid-column: 3; grid-row: 2; }
    .dpad-down  { grid-column: 2; grid-row: 3; }
    .dpad-hold  { grid-column: 1; grid-row: 3; font-size: 8px; font-weight: 600; grid-column: 1 / 2; }

    /* Hide dpad on real touch devices */
    @media (hover: none) and (pointer: coarse) {
      #dpad { display: none; }
    }
  </style>
</head>
<body>
  <div id="game-name"></div>
  <div id="info">Connecting...</div>
  <div id="score">0</div>
  <div id="result"></div>
  <div id="status"></div>
  <div id="gesture-hint"></div>
  <div id="swipe-arrow"></div>

  <!-- Desktop D-pad for testing swipes with mouse -->
  <div id="dpad">
    <button class="dpad-btn dpad-up" data-dir="up">&#9650;</button>
    <button class="dpad-btn dpad-left" data-dir="left">&#9664;</button>
    <button class="dpad-btn dpad-tap" data-dir="tap">TAP</button>
    <button class="dpad-btn dpad-right" data-dir="right">&#9654;</button>
    <button class="dpad-btn dpad-down" data-dir="down">&#9660;</button>
    <button class="dpad-btn dpad-hold" data-dir="hold">HOLD</button>
  </div>
  <div id="cooldown-wrap"><div id="cooldown-fill"></div></div>
  <div id="tap-pulse"></div>
  <div id="hold-ring"></div>
  <script src="/shared/sound.js"></script>
  <script src="/shared/colors.js"></script>
  <script src="/engine/Input.js"></script>
  <script src="/controller/onboarding.js"></script>
  <script src="/controller/main.js"></script>
</body>
</html>
