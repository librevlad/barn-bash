<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <title>Frantics — King of the Hill</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background-color: var(--bg-wood-deep);
      background-image: var(--bg-wood-plank);
      font-family: var(--font-ui);
      color: var(--text-cream);
    }
    canvas { display: block; position: fixed; inset: 0; }
    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.55) 100%);
    }
    /* Phase 40a — painted HUD. Top strip is split into three painted
       plaques: ALIVE plaque (left), game-title ribbon (center),
       ARENA plaque (right). No more flat gradient band. */
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 5;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: start;
      gap: 20px;
      padding: 14px 24px 0;
      pointer-events: none;
      /* Subtle fade from dark-wood to transparent so plaques read
         against painted arena below. */
      background: linear-gradient(180deg, rgba(20, 12, 7, 0.55) 0%, transparent 100%);
    }
    /* Generic painted plaque used for ALIVE and ARENA sides. */
    .hud-plaque {
      position: relative;
      min-width: 130px;
      padding: 8px 16px 10px;
      border-radius: 10px;
      /* Brass vertical gradient + dark rim + inner rim highlight */
      background:
        linear-gradient(180deg, #ffe290 0%, #d5972b 50%, #8d5a18 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 246, 200, 0.75),
        inset 0 -2px 3px rgba(40, 22, 10, 0.45),
        0 3px 10px rgba(0, 0, 0, 0.55),
        0 0 0 2px rgba(50, 28, 10, 0.85);
      text-align: center;
    }
    .hud-plaque::before {
      /* Top-edge highlight specular — painted brass feel. */
      content: '';
      position: absolute; top: 3px; left: 10%; right: 10%; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 250, 220, 0.85), transparent);
      border-radius: 2px;
      pointer-events: none;
    }
    .hud-plaque .hud-title {
      display: block;
      font-family: var(--font-accent);
      font-size: 10px;
      letter-spacing: 4px;
      color: rgba(60, 30, 8, 0.85);
      text-transform: uppercase;
      opacity: 0.95;
    }
    .hud-plaque .hud-value {
      display: block;
      font-family: var(--font-display);
      font-size: 26px;
      color: #2a160a;
      text-shadow: 0 1px 0 rgba(255, 246, 200, 0.45);
      letter-spacing: 1.5px;
      line-height: 1.1;
    }
    /* Center ribbon title. Painted red banner with gold trim. */
    .hud-banner {
      justify-self: center;
      position: relative;
      padding: 9px 36px 11px;
      margin-top: 2px;
      background:
        linear-gradient(180deg, #c73a2d 0%, #8b1d16 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 180, 160, 0.45),
        inset 0 -2px 4px rgba(40, 8, 4, 0.6),
        0 0 0 2px #6d1712,
        0 0 0 4px #d4952d,
        0 3px 14px rgba(0, 0, 0, 0.55);
      text-align: center;
      /* Trim both ends into ribbon chevrons via clip-path */
      clip-path: polygon(
        10px 0, calc(100% - 10px) 0, 100% 50%,
        calc(100% - 10px) 100%, 10px 100%, 0 50%
      );
    }
    .hud-banner-title {
      font-family: var(--font-display);
      font-size: 17px;
      color: #ffe290;
      letter-spacing: 4px;
      text-shadow: 0 2px 0 #4a0d09, 0 0 10px rgba(255, 190, 110, 0.45);
    }
    .hud-banner-sub {
      font-family: var(--font-accent);
      font-size: 11px;
      color: rgba(255, 230, 200, 0.85);
      margin-top: 1px;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }

    /* Legacy hooks kept so existing main.js HUD.update() still works.
       The painted plaque text lives in .hud-value; .hud-alive + .hud-plat
       are aliased below for backward compatibility. */
    .hud-alive { display: inline; }
    .hud-plat  { display: inline; }

    /* In-lobby eyebrow sits on the painted arch; needs strong contrast. */
    #lobby .hud-title {
      font-size: 12px;
      letter-spacing: 6px;
      opacity: 1;
      text-shadow: 0 1px 0 var(--accent-red-deep),
                   0 0 14px rgba(0, 0, 0, 0.8);
    }

    /* Phase 40a — live scoreboard. Painted wooden scroll pinned to
       the right edge, listing every player with color dot + name +
       score + crown on the leader. Appears only during running/result
       phases (toggled by main.js). */
    /* Phase 51b — #scoreboard CSS moved to shared theme.css. */

    /* Phase 40c — shrink-warning banner. Diagonal-stripe red-and-gold
       full-width caution strip that slides in from above when the
       server broadcasts shrink_warning. Auto-hides after 1.4 s. */
    #shrink-warn {
      position: fixed; top: 64px; left: 0; right: 0;
      height: 42px; z-index: 6;
      background:
        repeating-linear-gradient(135deg,
          rgba(217, 83, 79, 0.95) 0 22px,
          rgba(20, 10, 6, 0.9) 22px 44px);
      box-shadow:
        0 2px 0 rgba(255, 221, 107, 0.5),
        0 -2px 0 rgba(255, 221, 107, 0.5),
        0 6px 16px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffe290;
      font-family: var(--font-display);
      font-size: 18px;
      letter-spacing: 4px;
      text-shadow: 0 2px 0 #4a0d09, 0 0 12px rgba(0, 0, 0, 0.8);
      transform: translateY(-60px);
      opacity: 0;
      transition: transform 0.35s var(--ease-out), opacity 0.3s;
      pointer-events: none;
    }
    #shrink-warn.show {
      transform: translateY(0);
      opacity: 1;
      animation: shrinkWarnPulse 0.32s ease-in-out 3;
    }
    @keyframes shrinkWarnPulse {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.25); }
    }

    /* Phase 40c — sudden-death timer ring + the "SUDDEN DEATH" title
       shift. Ring renders above the HUD banner when suddenDeath flag
       is true; main.js sets the --pct CSS var to drive the conic
       gradient. */
    #sd-timer {
      position: fixed; top: 16px; left: 50%;
      transform: translateX(-50%) translateY(58px);
      z-index: 7;
      width: 52px; height: 52px;
      border-radius: 50%;
      background:
        conic-gradient(
          #d9534f calc(var(--pct, 100) * 1%),
          rgba(40, 20, 10, 0.85) 0
        );
      box-shadow:
        0 0 0 2px rgba(20, 10, 5, 0.85),
        0 0 0 4px rgba(216, 152, 45, 0.85),
        0 4px 14px rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
    }
    #sd-timer.show { display: flex; animation: sdTimerPulse 1.4s ease-in-out infinite; }
    #sd-timer::before {
      /* Cream inner disc so the digits don't fight the ring colour. */
      content: '';
      position: absolute; inset: 8px;
      border-radius: 50%;
      background: linear-gradient(180deg, #f5e5b5 0%, #d4ab6a 100%);
      box-shadow: inset 0 1px 0 rgba(255, 250, 220, 0.65), inset 0 -2px 0 rgba(60, 30, 10, 0.35);
    }
    #sd-timer .sd-num {
      position: relative;
      font-family: var(--font-display);
      font-size: 20px;
      color: #3b1a0a;
      text-shadow: 0 1px 0 rgba(255, 250, 220, 0.55);
      letter-spacing: 0.5px;
    }
    @keyframes sdTimerPulse {
      0%, 100% { box-shadow: 0 0 0 2px rgba(20, 10, 5, 0.85), 0 0 0 4px rgba(216, 152, 45, 0.85), 0 4px 14px rgba(0, 0, 0, 0.55), 0 0 16px rgba(217, 83, 79, 0.35); }
      50%      { box-shadow: 0 0 0 2px rgba(20, 10, 5, 0.85), 0 0 0 4px rgba(255, 100, 80, 0.9),  0 4px 14px rgba(0, 0, 0, 0.55), 0 0 30px rgba(217, 83, 79, 0.8); }
    }
    /* Phase 40b — painted countdown medallion. Brass outer ring,
       cream inner disc, bold dark numeral. On the last step ("FIGHT!"),
       the card flips to a wide red ribbon via the .go class. */
    #countdown {
      position: fixed; top: 50%; left: 50%;
      width: 240px; height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffe290 0%, #d5972b 55%, #8a5918 100%);
      box-shadow:
        inset 0 0 0 6px #5a3512,
        inset 0 0 0 10px #ffdd6b,
        inset 0 8px 0 rgba(255, 255, 255, 0.18),
        0 0 0 3px rgba(20, 10, 5, 0.85),
        0 12px 44px rgba(0, 0, 0, 0.6),
        0 0 60px rgba(255, 220, 120, 0.35);
      display: none;
      pointer-events: none;
      z-index: 25;
      transition: transform 0.42s var(--ease-out), opacity 0.3s;
      transform: translate(-50%, -50%) scale(0.7);
      opacity: 0;
      color: #2a160a;
      font-family: var(--font-display);
      /* Flex centering kicks in when display is flipped to flex by
         the harness — but harness uses 'block'. Use line-height +
         text-align on the inner .cd-num instead. */
    }
    #countdown::before {
      /* Cream inner panel — the numeral sits against this. */
      content: '';
      position: absolute; inset: 24px;
      border-radius: 50%;
      background: linear-gradient(180deg, #f5e5b5 0%, #d4ab6a 100%);
      box-shadow:
        inset 0 2px 0 rgba(255, 250, 220, 0.65),
        inset 0 -3px 0 rgba(60, 30, 10, 0.35);
      z-index: 0;
    }
    #countdown::after {
      /* Eight gold radial studs around the rim for carnival flair. */
      content: '';
      position: absolute; inset: -2px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50%   3%, #ffdd6b 0 4px, transparent 5px),
        radial-gradient(circle at 50%  97%, #ffdd6b 0 4px, transparent 5px),
        radial-gradient(circle at  3% 50%, #ffdd6b 0 4px, transparent 5px),
        radial-gradient(circle at 97% 50%, #ffdd6b 0 4px, transparent 5px),
        radial-gradient(circle at 17% 17%, #ffdd6b 0 3px, transparent 4px),
        radial-gradient(circle at 83% 17%, #ffdd6b 0 3px, transparent 4px),
        radial-gradient(circle at 17% 83%, #ffdd6b 0 3px, transparent 4px),
        radial-gradient(circle at 83% 83%, #ffdd6b 0 3px, transparent 4px);
      pointer-events: none;
    }
    #countdown .cd-num {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 130px;
      line-height: 1;
      color: #2a160a;
      text-shadow:
        0 2px 0 rgba(255, 248, 220, 0.55),
        0 6px 14px rgba(0, 0, 0, 0.35);
      letter-spacing: 0;
    }
    /* Final "FIGHT!" step — widen into a painted red banner. */
    #countdown.go {
      width: 480px; height: 160px;
      border-radius: 18px;
      background: linear-gradient(180deg, #d24030 0%, #8a1b14 100%);
      box-shadow:
        inset 0 2px 0 rgba(255, 180, 160, 0.55),
        inset 0 -4px 8px rgba(40, 6, 4, 0.7),
        0 0 0 3px #5a110c,
        0 0 0 6px #d5972b,
        0 0 0 8px rgba(20, 10, 5, 0.9),
        0 14px 44px rgba(0, 0, 0, 0.65),
        0 0 80px rgba(255, 100, 60, 0.45);
    }
    #countdown.go::before { inset: 12px; border-radius: 8px; background: linear-gradient(180deg, #b73325 0%, #6f1611 100%); }
    #countdown.go::after { display: none; }
    #countdown.go .cd-num {
      font-size: 86px;
      color: #ffdd6b;
      letter-spacing: 4px;
      text-shadow:
        0 3px 0 #4a0d09,
        0 0 18px rgba(255, 190, 110, 0.55),
        0 0 44px rgba(255, 80, 60, 0.35);
    }

    /* Phase 40b — painted message ribbon. Slides down from above,
       reads as a carnival announcement card. Replaces the prior
       plain-text overlay. */
    #message {
      position: fixed; top: 14%; left: 50%;
      transform: translate(-50%, -18px);
      min-width: 220px; max-width: 80vw;
      padding: 10px 36px 12px;
      background: linear-gradient(180deg, #fff0c2 0%, #e7c576 100%);
      color: #3b1a0a;
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: 1.2px;
      text-align: center;
      /* Ribbon chevron ends */
      clip-path: polygon(
        14px 0, calc(100% - 14px) 0, 100% 50%,
        calc(100% - 14px) 100%, 14px 100%, 0 50%
      );
      box-shadow:
        inset 0 1px 0 rgba(255, 250, 220, 0.75),
        inset 0 -2px 4px rgba(90, 50, 20, 0.4),
        0 6px 20px rgba(0, 0, 0, 0.45);
      pointer-events: none; opacity: 0;
      transition: opacity 0.3s ease-out, transform 0.3s var(--ease-out);
      z-index: 5;
      text-shadow: 0 1px 0 rgba(255, 250, 220, 0.6);
    }
    #message.show { opacity: 1; transform: translate(-50%, 0); }
    #winner-overlay {
      position: fixed; inset: 0;
      background: rgba(47, 28, 12, 0.9);
      backdrop-filter: blur(6px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.6s;
      z-index: 10;
    }
    #winner-overlay.show { opacity: 1 !important; pointer-events: auto !important; }
    .w-text {
      font-family: var(--font-display);
      font-size: 44px; font-weight: 400;
      letter-spacing: 1px;
      text-shadow: 0 2px 0 var(--accent-red-deep),
                   0 0 36px currentColor;
    }
    .w-sub {
      font-family: var(--font-accent);
      font-size: 16px; font-style: italic;
      color: var(--text-dim);
      margin-top: 12px;
      letter-spacing: 0.5px;
    }
    #controls {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%);
      z-index: 20; display: none; gap: 14px;
    }
    button {
      font-family: var(--font-display);
      font-size: 16px;
      padding: 14px 40px;
      background: var(--bg-ticket-face);
      color: var(--text-on-gold);
      border: var(--border-norm) solid var(--accent-gold-edge);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-ticket);
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform var(--dur-tap), box-shadow var(--dur-tap);
    }
    button:hover {
      background: var(--bg-ticket-face-hot);
      transform: translateY(-1px);
      box-shadow: var(--shadow-ticket-hover);
    }
    button:active {
      transform: translateY(3px);
      box-shadow: var(--shadow-ticket-press);
    }
    #lobby {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      /* Phase 57a — transparent so body > #bg shows through. */
    }
    #lobby.hidden { display: none; }
    /* Phase 10c — painterly king's-arena banner backdrop behind title stack */
    #lobby .lobby-backdrop {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      max-height: 500px; max-width: 700px;
      width: auto; height: auto;
      opacity: 0.95;
      z-index: 0;
      pointer-events: none;
    }
    #lobby > *:not(.lobby-backdrop) { position: relative; z-index: 1; }
    #lobby h1 {
      font-family: var(--font-accent);
      font-size: 11px; font-weight: 400;
      letter-spacing: var(--tracking-widest);
      color: var(--accent-gold);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    #lobby h2 {
      font-family: var(--font-display);
      font-size: 48px; font-weight: 400;
      color: var(--accent-gold);
      letter-spacing: 2px;
      text-shadow: var(--text-shadow-stack);
      margin-bottom: 26px;
    }
    #lobby-info {
      font-family: var(--font-accent);
      font-size: 15px; font-style: italic;
      color: var(--text-cream);
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.8),
                   0 0 12px rgba(0, 0, 0, 0.7);
      margin-bottom: 22px;
      letter-spacing: 0.3px;
    }
    /* Phase 51a — lobby slot + hint CSS moved to client-shared/theme.css
       so escape / meteor / race inherit the painted cards via the
       already-included theme stylesheet. */
    #lobby button { font-size: 20px; padding: 18px 56px; letter-spacing: 1.5px; }
  </style>
</head>
<body>
  <div id="bg"></div>
  <canvas id="game-canvas"></canvas>
  <div id="vignette"></div>
  <!-- Phase 40a — painted HUD. Three-column layout (ALIVE plaque /
       banner title / ARENA plaque). Legacy ids kept so main.js
       HUD update code continues to work. -->
  <div id="hud" style="display:none">
    <div class="hud-plaque">
      <span class="hud-title">Alive</span>
      <span class="hud-value hud-alive" id="hud-alive">2/2</span>
    </div>
    <div class="hud-banner">
      <div class="hud-banner-title"><span class="sb-crown-icon">&#x1F451;</span> King of the Hill</div>
      <div class="hud-banner-sub" id="hud-subbanner">&#x2014;</div>
    </div>
    <div class="hud-plaque">
      <span class="hud-title">Arena</span>
      <span class="hud-value hud-plat" id="hud-plat">100%</span>
    </div>
  </div>
  <!-- Phase 40a — live scoreboard pinned right-edge, toggled by main.js. -->
  <div id="scoreboard">
    <div class="sb-head">Standings</div>
    <ul class="sb-list" id="sb-list"></ul>
  </div>
  <!-- Phase 40c — full-width shrink warning banner. -->
  <div id="shrink-warn">&#x26A0; ARENA SHRINKING &#x26A0;</div>
  <!-- Phase 40c — sudden-death countdown ring. --conic-pct driven by main.js. -->
  <div id="sd-timer"><span class="sd-num" id="sd-num">0:25</span></div>
  <div id="countdown"></div>
  <div id="message"></div>
  <div id="winner-overlay"></div>
  <div id="lobby">
    <img class="lobby-backdrop" src="/assets/lobby-hill.png" onerror="this.remove()">
    <h1>FRANTICS</h1>
    <h2>KING OF THE HILL</h2>
    <div id="lobby-info">Waiting for players...</div>
    <div id="lobby-players"></div>
    <div id="lobby-hint">&#x1F579; Drag joystick to move &middot; tap to dash &middot; swipe down to slam &middot; hold to shield</div>
    <button id="btn-start" style="display:none">START</button>
  </div>
  <div id="controls">
    <button id="btn-again">PLAY AGAIN</button>
    <button id="btn-lobby">LOBBY</button>
  </div>
  <script src="/shared/error-reporter.js"></script>
  <script src="/shared/protocol.js"></script>
  <script src="/shared/icons.js"></script>
  <script src="/shared/characters.js"></script>
  <script src="/shared/char-sprite.js"></script>
  <script src="/shared/host-common.js"></script>
  <script src="/shared/lobby-slots.js"></script>
  <script src="/shared/scoreboard.js"></script>
  <script src="/shared/narrator.js"></script>
  <script src="/shared/sound.js"></script>
  <script src="/shared/hud.js"></script>
  <script src="/shared/effects.js"></script>
  <script src="/shared/visual.js"></script>
  <script src="/shared/transitions.js"></script>
  <script src="/shared/tournament.js"></script>
  <script src="/shared/ambient-fx.js"></script>
  <script src="/shared/postgame.js"></script>
  <script src="/engine/palette.js"></script>
  <script src="/engine/GameLoop.js"></script>
  <script src="/engine/Camera2D.js"></script>
  <script src="/engine/Tween.js"></script>
  <script src="/engine/Scene.js"></script>
  <script src="/engine/Particles.js"></script>
  <script src="/engine/Entity.js"></script>
  <script src="/engine/SpriteLoader.js"></script>
  <script src="render2d.js"></script>
  <script src="/shared/host-harness.js"></script>
  <script src="main.js"></script>
</body>
</html>
