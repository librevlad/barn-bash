<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Frantics — King of the Hill</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #06060f; font-family: -apple-system, 'Segoe UI', sans-serif; color: #eee; }
    canvas { display: block; position: fixed; inset: 0; }
    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
    }
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 5;
      display: flex; justify-content: space-between; padding: 20px 32px; pointer-events: none;
    }
    .hud-title { font-size: 10px; letter-spacing: 5px; opacity: 0.4; }
    .hud-alive { font-size: 24px; font-weight: 900; }
    .hud-plat { font-size: 12px; opacity: 0.5; margin-top: 2px; }
    #countdown {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 120px; font-weight: 900;
      text-shadow: 0 4px 40px rgba(120,80,200,0.5);
      pointer-events: none; display: none; z-index: 25;
      transition: transform 0.4s cubic-bezier(0.22,1,0.36,1), opacity 0.3s;
    }
    #message {
      position: fixed; top: 28%; left: 50%; transform: translate(-50%, -50%);
      font-size: 28px; font-weight: 900; letter-spacing: 2px;
      text-shadow: 0 3px 20px rgba(120,80,200,0.4);
      pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 5;
    }
    #message.show { opacity: 1; }
    #winner-overlay {
      position: fixed; inset: 0; background: rgba(6,6,15,0.85);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.6s; z-index: 10;
    }
    #winner-overlay.show { opacity: 1; pointer-events: auto; }
    .w-text { font-size: 40px; font-weight: 900; text-shadow: 0 0 40px rgba(180,120,255,0.4); }
    .w-sub { font-size: 16px; color: #888; margin-top: 12px; }
    #controls {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      z-index: 20; display: none; gap: 14px;
    }
    button {
      font-size: 15px; padding: 14px 40px; font-weight: 600;
      background: rgba(20,15,40,0.8); color: #ccc;
      border: 1px solid rgba(180,120,255,0.2); border-radius: 10px; cursor: pointer;
    }
    button:hover { background: rgba(40,30,70,0.9); color: #fff; }
    #lobby {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #06060f 0%, #1a0f2e 100%);
    }
    #lobby.hidden { display: none; }
    #lobby h1 { font-size: 10px; letter-spacing: 8px; color: #555; margin-bottom: 8px; }
    #lobby h2 { font-size: 32px; color: #B070FF; font-weight: 900; margin-bottom: 24px;
                text-shadow: 0 0 50px rgba(180,112,255,0.3); }
    #lobby-info { font-size: 14px; color: #666; margin-bottom: 20px; }
    #lobby-players { font-size: 18px; margin-bottom: 28px; }
    #lobby button { font-size: 17px; padding: 16px 56px; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="vignette"></div>
  <div id="hud" style="display:none">
    <div>
      <div class="hud-title">KING OF THE HILL</div>
      <div class="hud-alive" id="hud-alive">2/2 alive</div>
    </div>
    <div class="hud-plat" id="hud-plat"></div>
  </div>
  <div id="countdown"></div>
  <div id="message"></div>
  <div id="winner-overlay"></div>
  <div id="lobby">
    <h1>FRANTICS</h1>
    <h2>KING OF THE HILL</h2>
    <div id="lobby-info">Waiting for players...</div>
    <div id="lobby-players"></div>
    <button id="btn-start" style="display:none">START</button>
  </div>
  <div id="controls">
    <button id="btn-again">PLAY AGAIN</button>
    <button id="btn-lobby">LOBBY</button>
  </div>
  <script src="/shared/characters.js"></script>
  <script src="/shared/host-common.js"></script>
  <script src="/shared/narrator.js"></script>
  <script src="/shared/sound.js"></script>
  <script src="/shared/hud.js"></script>
  <script src="/shared/effects.js"></script>
  <script src="/shared/visual.js"></script>
  <script src="/shared/transitions.js"></script>
  <script src="/shared/tournament.js"></script>
  <script src="/engine/GameLoop.js"></script>
  <script src="/engine/Camera2D.js"></script>
  <script src="/engine/Tween.js"></script>
  <script src="/engine/Scene.js"></script>
  <script src="/engine/Particles.js"></script>
  <script src="/engine/Entity.js"></script>
  <script src="render2d.js"></script>
  <script src="main.js"></script>
</body>
</html>
