<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Barn Bash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chango&family=Fredoka:wght@400;500;600;700&family=Luckiest+Guy&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2a1a10;
    --ink-soft: #4a2f1e;
    --cream: #fff3d6;
    --cream-2: #ffe6a9;
    --sky: #a6d8ee;
    --grass: #7cc06a;
    --grass-dk: #4a8c3e;
    --wood: #b8763d;
    --wood-dk: #7a4920;
    --red: #e04b3b;
    --red-dk: #a8291a;
    --yellow: #ffc93c;
    --yellow-dk: #d99312;
    --blue: #4aa3e0;
    --blue-dk: #1f6fa8;
    --green: #6cc24a;
    --green-dk: #3e8a29;
    --purple: #a36bd1;
    --orange: #f08a3a;
    --pink: #f28bbd;
  }
  html,body{margin:0;padding:0;background:#1a0e08;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);overflow:hidden;height:100%;}
  #root{position:fixed;inset:0;}
  /* stage scaling */
  .stage-wrap{position:fixed;inset:0;background:#1a0e08;overflow:hidden;}
  .stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;margin-left:-800px;margin-top:-450px;overflow:hidden;border-radius:8px;background:var(--sky);box-shadow:0 40px 100px rgba(0,0,0,.6);transform-origin:center center;}

  /* chunky cartoon button */
  .btn{
    font-family:'Luckiest Guy', 'Chango', cursive;
    letter-spacing:1.5px;
    color:#fff;
    -webkit-text-stroke: 1.5px var(--ink);
    text-shadow: 0 3px 0 rgba(0,0,0,.25);
    background: var(--yellow);
    border:4px solid var(--ink);
    border-radius:18px;
    padding:14px 28px;
    box-shadow:0 8px 0 var(--ink), 0 10px 0 rgba(0,0,0,.2);
    cursor:pointer;
    transform:translateY(0);
    transition:transform .08s ease, box-shadow .08s ease, filter .15s ease;
    font-size:28px;
    display:inline-flex;align-items:center;gap:10px;
    user-select:none;
  }
  .btn:hover{filter:brightness(1.05);}
  .btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink);}
  .btn.green{background:var(--green);}
  .btn.red{background:var(--red);}
  .btn.blue{background:var(--blue);}
  .btn.orange{background:var(--orange);}
  .btn.cream{background:var(--cream);color:var(--ink);-webkit-text-stroke:0;text-shadow:none;}
  .btn.sm{font-size:18px;padding:8px 16px;border-radius:12px;box-shadow:0 5px 0 var(--ink);}
  .btn.sm:active{box-shadow:0 1px 0 var(--ink);transform:translateY(4px);}
  .btn.xl{font-size:40px;padding:20px 44px;border-radius:24px;box-shadow:0 12px 0 var(--ink), 0 14px 0 rgba(0,0,0,.25);}
  .btn.xl:active{box-shadow:0 3px 0 var(--ink);transform:translateY(9px);}
  .btn[disabled]{filter:grayscale(.6) brightness(.8);cursor:not-allowed;}

  /* wood sign / plank */
  .plank{
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.04) 0 3px, transparent 3px 38px),
      linear-gradient(180deg, #c78a4d, #9c5f28);
    border:5px solid var(--wood-dk);
    border-radius:14px;
    box-shadow: inset 0 4px 0 rgba(255,255,255,.15), 0 10px 0 rgba(0,0,0,.25);
    color:var(--cream);
  }

  /* speech bubble */
  .bubble{
    background:#fff;
    border:4px solid var(--ink);
    border-radius:22px;
    padding:10px 16px;
    font-weight:600;
    position:relative;
    box-shadow:0 6px 0 var(--ink);
  }
  .bubble:after{
    content:"";position:absolute;bottom:-14px;left:30px;width:22px;height:22px;background:#fff;
    border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(45deg);
  }

  /* title word */
  .word{
    font-family:'Luckiest Guy','Chango',cursive;
    letter-spacing:2px;
    -webkit-text-stroke: 4px var(--ink);
    text-shadow: 0 8px 0 var(--ink), 0 10px 0 rgba(0,0,0,.2);
    display:inline-block;
  }

  .pix{image-rendering:pixelated;}

  /* simple wiggle */
  @keyframes wiggle { 0%,100%{transform:rotate(-2deg) translateY(0)} 50%{transform:rotate(2deg) translateY(-4px)} }
  .wiggle{animation:wiggle 2.4s ease-in-out infinite;}
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .bob{animation:bob 2.6s ease-in-out infinite;}
  @keyframes pop-in { 0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.1);opacity:1} 100%{transform:scale(1);opacity:1} }
  .pop-in{animation:pop-in .4s cubic-bezier(.3,1.5,.5,1) both;}
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  .pulse{animation:pulse 1.1s ease-in-out infinite;}
  @keyframes logo-glow { 0%,100%{filter:drop-shadow(0 0 10px #ffc93c) drop-shadow(0 0 20px rgba(255,201,60,.5))} 50%{filter:drop-shadow(0 0 22px #fff5a8) drop-shadow(0 0 40px rgba(255,201,60,.8))} }
  @keyframes float-up-down { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-20px) rotate(2deg)} }
  @keyframes particle-rise { 0%{transform:translateY(0) scale(0); opacity:0} 15%{opacity:1;transform:translateY(-20px) scale(1)} 100%{transform:translateY(-400px) scale(.3); opacity:0} }
  @keyframes shine-sweep { 0%{transform:translateX(-120%) skewX(-20deg)} 100%{transform:translateX(220%) skewX(-20deg)} }
  @keyframes sparkle-spin { to{ transform:rotate(360deg);} }
  @keyframes drift { 0%{transform:translateX(-20px)} 100%{transform:translateX(20px)} }
  .logo-glow{animation:logo-glow 2.8s ease-in-out infinite;}
  .title-float{animation:float-up-down 4s ease-in-out infinite;}

  /* clouds */
  .cloud{
    position:absolute;background:#fff;border-radius:50%;
    box-shadow: 40px 5px 0 0 #fff, 80px -5px 0 -5px #fff, -30px 0 0 -5px #fff, 20px 15px 0 -5px #fff;
  }

  /* hit marker for confetti */
  .confetti{position:absolute;width:10px;height:14px;pointer-events:none;}

  /* scrollbar for lists */
  .scroll::-webkit-scrollbar{width:10px;height:10px;}
  .scroll::-webkit-scrollbar-thumb{background:var(--wood);border-radius:10px;}
  .scroll::-webkit-scrollbar-track{background:transparent;}

  /* disable text select for game surfaces */
  .stage, .stage *{ -webkit-user-select:none; user-select:none; }
  /* except inputs */
  input, textarea{ -webkit-user-select:text; user-select:text; }

  /* focus-visible reset */
  .btn:focus{outline:none;}
  .btn:focus-visible{outline:3px dashed var(--ink);outline-offset:4px;}

  /* tweaks panel */
  .tweaks{
    position:fixed;right:16px;bottom:16px;z-index:50;width:320px;
    background:#fff;border:4px solid var(--ink);border-radius:20px;
    box-shadow:0 10px 0 var(--ink), 0 18px 40px rgba(0,0,0,.35);
    padding:14px 16px;font-family:'Fredoka',sans-serif;color:var(--ink);
    transform:translateY(120%);opacity:0;pointer-events:none;transition:transform .3s ease, opacity .3s ease;
  }
  .tweaks.open{transform:translateY(0);opacity:1;pointer-events:auto;}
  .tweaks h3{margin:4px 0 10px;font-family:'Luckiest Guy';letter-spacing:1px;font-size:22px;}
  .tweaks label{display:block;margin:10px 0 4px;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:#6b4a2e;}
  .tweaks .row{display:flex;gap:6px;flex-wrap:wrap;}
  .swatch{width:28px;height:28px;border-radius:10px;border:3px solid var(--ink);cursor:pointer;}
  .swatch.on{box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--ink);}
  .seg{display:flex;gap:4px;background:#f4e6c2;border:3px solid var(--ink);border-radius:12px;padding:3px;}
  .seg button{flex:1;border:0;background:transparent;padding:6px;border-radius:8px;font-weight:700;cursor:pointer;font-family:'Fredoka';}
  .seg button.on{background:var(--yellow);box-shadow:0 2px 0 var(--ink);}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Load order:
     1. Multiplayer provider (exposes BB.mp).
     2. Core primitives — Screen enum, reducer, math helpers, player label,
        score payloads. Pure JS, attach to BB.core / window globals.
     3. Games registry (BB.games) before the mini-games self-register.
     4. Character SVG art + ui widgets (React hooks destructured here for
        the rest of the scripts to pick up).
     5. UI timing hooks (useRaf / useInterval) used by mini-games.
     6. Countdown overlay, then screens and per-folder mini-games.
     7. Tweaks panel, SceneManager, and finally app.jsx which boots
        everything inside <MultiplayerProvider>. -->
<script type="text/babel" src="src/multiplayer.jsx"></script>
<script type="text/babel" src="src/core/screens.js"></script>
<script type="text/babel" src="src/core/math.js"></script>
<script type="text/babel" src="src/core/players.js"></script>
<script type="text/babel" src="src/core/gameReducer.js"></script>
<script type="text/babel" src="src/core/score.js"></script>
<script type="text/babel" src="src/config/twists.js"></script>
<script type="text/babel" src="src/games/registry.js"></script>
<script type="text/babel" src="src/characters.jsx"></script>
<script type="text/babel" src="src/core/lineup.js"></script>
<script type="text/babel" src="src/ui/timing.jsx"></script>
<script type="text/babel" src="src/ui/widgets.jsx"></script>
<script type="text/babel" src="src/ui/Countdown.jsx"></script>
<script type="text/babel" src="src/screens/TitleScreen.jsx"></script>
<script type="text/babel" src="src/screens/CharacterSelect.jsx"></script>
<script type="text/babel" src="src/screens/BoardScreen.jsx"></script>
<script type="text/babel" src="src/screens/Scoreboard.jsx"></script>
<script type="text/babel" src="src/screens/Podium.jsx"></script>
<script type="text/babel" src="src/games/pig-sprint/PigSprint.jsx"></script>
<script type="text/babel" src="src/games/hay-panic/HayPanic.jsx"></script>
<script type="text/babel" src="src/games/apple-aim/AppleAim.jsx"></script>
<script type="text/babel" src="src/games/whack-a-gopher/WhackAGopher.jsx"></script>
<script type="text/babel" src="src/games/egg-pass/EggPass.jsx"></script>
<script type="text/babel" src="src/games/mud-dash/MudDash.jsx"></script>
<script type="text/babel" src="src/games/tug-o-war/TugOWar.jsx"></script>
<script type="text/babel" src="src/games/fishing-frenzy/FishingFrenzy.jsx"></script>
<script type="text/babel" src="src/games/barn-jump/BarnJump.jsx"></script>
<script type="text/babel" src="src/tweaks.jsx"></script>
<script type="text/babel" src="src/engine/MinigameHost.jsx"></script>
<script type="text/babel" src="src/engine/SceneManager.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
